# ==========================================================================
# 系统初始化配置文件
# 使用方法：python manage.py init_system
# 首次部署时运行，创建必要的账号、角色、权限、部门等基础数据
# ==========================================================================

# ------------------------------
# 初始超级管理员账号
# 其他用户由超级管理员登录后在系统中创建
# ------------------------------
users:
  - username: admin1
    email: admin1@example.com
    real_name: 系统管理员
    password: Admin1@1234
    role: super_admin

  - username: admin2
    email: admin2@example.com
    real_name: 系统管理员
    password: Admin2@1234
    role: super_admin

# ------------------------------
# 系统内置角色（8 个，与 seed_permissions.py 完全对齐）
# role_type: GLOBAL(全局) / DEPT_SCOPE(部门属地) / TEAM_SCOPE(团队属地) / NORMAL_USER(普通)
# data_scope: GLOBAL(全局级) / DEPT(部门级) / TEAM(团队级) —— 决定数据可见范围等级
# ------------------------------
roles:
  # ---- 全局 ----
  - code: super_admin
    name: 超级管理员
    description: 最高权限（系统级快路径，鉴权绕过 permission_key）
    is_builtin: true
    role_type: GLOBAL
    data_scope: GLOBAL

  - code: user_admin
    name: 人员管理员
    description: 管理组织/人员/部门/团队，不可操作文档
    is_builtin: true
    role_type: GLOBAL
    data_scope: GLOBAL

  - code: kb_admin
    name: 文档管理员
    description: 管理全部知识库/文档，不可管理人
    is_builtin: true
    role_type: GLOBAL
    data_scope: GLOBAL

  - code: compliance_admin
    name: 合规审计员
    description: 查看审计日志/合规校验，只读
    is_builtin: true
    role_type: GLOBAL
    data_scope: GLOBAL

  # ---- 部门/团队属地 ----
  - code: dept_manager
    name: 部门经理
    description: 管理指定部门人员/部门级知识库
    is_builtin: true
    role_type: DEPT_SCOPE
    data_scope: DEPT

  - code: team_leader
    name: 团队组长
    description: 管理指定团队人员/团队级知识库
    is_builtin: true
    role_type: TEAM_SCOPE
    data_scope: TEAM

  # contributor 显式授权角色，需申请获得，获得后覆盖 viewer 兜底
  - code: contributor
    name: 参与者
    description: 显式授权角色，需申请获得，获得后覆盖 viewer 兜底，可查看/上传/下载文档
    is_builtin: true
    role_type: NORMAL_USER
    data_scope: TEAM

  # viewer 普通用户 兜底角色，随人事归属生效自带只读，未显式授权 contributor 时自动叠加
  - code: viewer
    name: 查看者
    description: 兜底角色，随人事归属生效自带只读，未显式授权 contributor 时自动叠加
    is_builtin: true
    role_type: NORMAL_USER
    data_scope: TEAM

  # 维护管理员：可查看和修改系统配置（KV），不可管理用户/角色/文档
  - code: system_maintainer
    name: 维护管理员
    description: 可查看和修改系统配置（LLM/Embedding/检索/评估等运行期参数），不持有用户/角色/文档管理权限
    is_builtin: true
    role_type: GLOBAL
    data_scope: GLOBAL

# ------------------------------
# 系统内置权限点（三段式 permission_key = {module}.{resource}.{action}，个别四级 key）
# 与 seed_permissions.py 的 PERMISSIONS 清单完全对齐
# ------------------------------
permissions:
  # ---- org 模块 —— 组织架构管理（部门 / 团队） ----
  - code: org.dept.create
    name: 创建部门
    module: org
    is_builtin: true

  - code: org.dept.update
    name: 更新部门
    module: org
    is_builtin: true

  - code: org.dept.delete
    name: 删除部门
    module: org
    is_builtin: true

  - code: org.team.create
    name: 创建团队
    module: org
    is_builtin: true

  - code: org.team.update
    name: 更新团队
    module: org
    is_builtin: true

  - code: org.team.delete
    name: 删除团队
    module: org
    is_builtin: true

  # ---- user 模块 —— 人员管理（邀请 / 部门团队内管理 / 全局管理 / 调岗 / 禁用） ----
  - code: user.invite
    name: 邀请员工
    module: user
    is_builtin: true

  - code: user.manage
    name: 管理部门/团队内用户
    module: user
    is_builtin: true

  - code: user.manage_all
    name: 全局用户管理
    module: user
    is_builtin: true

  - code: user.transfer
    name: 员工调岗
    module: user
    is_builtin: true

  - code: user.disable
    name: 禁用用户
    module: user
    is_builtin: true

  # ---- role 模块 —— 角色授权与撤销（按授权 Scope 区分审批链路） ----
  - code: role.grant.global
    name: 授予全局角色
    module: role
    is_builtin: true

  - code: role.grant.dept
    name: 授予部门角色
    module: role
    is_builtin: true

  - code: role.grant.team
    name: 授予团队角色
    module: role
    is_builtin: true

  - code: role.revoke
    name: 撤销角色
    module: role
    is_builtin: true

  # ---- kb 模块 —— 知识库全局管理 / 节点管理 / 文档管理 ----
  - code: kb.manage_all
    name: 知识库全局管理
    module: kb
    is_builtin: true

  - code: kb.node.manage
    name: 知识节点管理
    module: kb
    is_builtin: true

  - code: kb.node.create
    name: 创建节点
    module: kb
    is_builtin: true

  - code: kb.node.move
    name: 移动节点
    module: kb
    is_builtin: true

  - code: kb.node.delete
    name: 删除节点
    module: kb
    is_builtin: true

  - code: kb.document.read
    name: 读取文档
    module: kb
    is_builtin: true

  - code: kb.document.upload
    name: 上传文档
    module: kb
    is_builtin: true

  - code: kb.document.delete
    name: 删除文档
    module: kb
    is_builtin: true

  - code: kb.document.update
    name: 更新文档
    module: kb
    is_builtin: true

  - code: kb.document.download
    name: 下载文档
    module: kb
    is_builtin: true

  - code: kb.document.share
    name: 分享文档
    module: kb
    is_builtin: true

  - code: kb.document.promote_to_dept
    name: 文档上推至部门级
    module: kb
    is_builtin: true

  - code: kb.document.access.approve
    name: 批准文档访问申请
    module: kb
    is_builtin: true

  - code: kb.document.block.manage
    name: 管理文档黑名单
    module: kb
    is_builtin: true

  # ---- audit 模块 —— 审计日志与完整性校验（合规要求只读不可删） ----
  - code: audit.log.read
    name: 查看审计日志
    module: audit
    is_builtin: true

  - code: audit.log.export
    name: 导出审计日志
    module: audit
    is_builtin: true

  - code: audit.integrity.check
    name: 完整性校验
    module: audit
    is_builtin: true

  # ---- analytics 模块 —— 运营分析报表 ----
  - code: analytics.system.read
    name: 系统级指标
    module: analytics
    is_builtin: true

  - code: analytics.system.write
    name: 系统级写（关键词权重/反馈状态/报告删除）
    module: analytics
    is_builtin: true

  - code: analytics.org.read
    name: 组织使用报表
    module: analytics
    is_builtin: true

  # ---- compliance 模块 —— 合规审计 ----
  - code: compliance.audit
    name: 合规审计
    module: compliance
    is_builtin: true

  # ---- system 模块 —— 系统配置管理（KV 配置项前端可改） ----
  - code: system.config.read
    name: 查看系统配置
    module: system
    is_builtin: true

  - code: system.config.write
    name: 修改系统配置
    module: system
    is_builtin: true

# ------------------------------
# 角色-权限映射（key = role_key，value = permission_key 列表）
# 与 seed_permissions.py 的 ROLE_PERMISSIONS 完全对齐（通配符已展开为具体 key）
# ------------------------------
role_permissions:
  # 超级管理员：权限全部放开
  super_admin:
    - org.dept.create
    - org.dept.update
    - org.dept.delete
    - org.team.create
    - org.team.update
    - org.team.delete
    - user.invite
    - user.manage
    - user.manage_all
    - user.transfer
    - user.disable
    - role.grant.global
    - role.grant.dept
    - role.grant.team
    - role.revoke
    - kb.manage_all
    - kb.node.manage
    - kb.node.create
    - kb.node.move
    - kb.node.delete
    - kb.document.read
    - kb.document.upload
    - kb.document.delete
    - kb.document.update
    - kb.document.download
    - kb.document.share
    - kb.document.promote_to_dept
    - kb.document.access.approve
    - kb.document.block.manage
    - audit.log.read
    - audit.log.export
    - audit.integrity.check
    - analytics.system.read
    - analytics.system.write
    - analytics.org.read
    - compliance.audit
    - system.config.read
    - system.config.write

  # 人员管理员：组织+人员全域管理，不持有任何 kb.* 文档权限
  user_admin:
    - org.dept.create
    - org.dept.update
    - org.dept.delete
    - org.team.create
    - org.team.update
    - org.team.delete
    - user.invite
    - user.manage
    - user.manage_all
    - user.transfer
    - user.disable
    - role.grant.dept
    - role.grant.team
    - role.revoke
    - audit.log.read

  # 文档管理员：知识库+文档全域管理，不持有任何 org.*/user.* 人员权限
  kb_admin:
    - kb.manage_all
    - kb.node.manage
    - kb.node.create
    - kb.node.move
    - kb.node.delete
    - kb.document.read
    - kb.document.upload
    - kb.document.delete
    - kb.document.update
    - kb.document.download
    - kb.document.share
    - kb.document.promote_to_dept
    - kb.document.access.approve
    - kb.document.block.manage
    - audit.log.read

  # 合规审计员：只读审计/合规/分析，不持有任何写操作权限
  compliance_admin:
    - audit.log.read
    - audit.log.export
    - audit.integrity.check
    - compliance.audit
    - analytics.system.read
    - analytics.org.read

  # 部门经理：本部门人员/团队/节点/文档管理
  dept_manager:
    - org.team.create
    - org.team.update
    - user.invite
    - user.manage
    - role.grant.team
    - role.revoke
    - kb.node.manage
    - kb.node.create
    - kb.node.move
    - kb.document.read
    - kb.document.upload
    - kb.document.delete
    - kb.document.update
    - kb.document.download
    - kb.document.share
    - kb.document.access.approve
    - kb.document.block.manage
    - analytics.org.read

  # 团队组长：本团队人员/节点/文档管理，可上推文档至部门级
  team_leader:
    - user.invite
    - role.revoke
    - kb.node.manage
    - kb.node.create
    - kb.document.read
    - kb.document.upload
    - kb.document.delete
    - kb.document.update
    - kb.document.download
    - kb.document.share
    - kb.document.promote_to_dept
    - kb.document.access.approve
    - kb.document.block.manage
    - analytics.org.read

  # 参与者：随人事归属生效的兜底角色，仅本团队文档读/上传/下载
  contributor:
    - kb.document.read
    - kb.document.upload
    - kb.document.download

  # 查看者：默认准入角色，仅可读取文档，无下载/写操作权限
  # 需通过申请流程升级为 contributor 获得写权限
  viewer:
    - kb.document.read

  # 维护管理员：仅系统配置读写，不持有任何 org/user/kb 文档权限
  system_maintainer:
    - system.config.read
    - system.config.write

# ------------------------------
# 全局记忆（公司规则）
# ------------------------------
global_memories:
  - key: company_rules
    content: "公司内部信息安全规范：禁止泄露公司机密数据、客户信息、财务数据等敏感信息。所有回答必须严格遵守公司保密制度。"
    scope_root_types: ["all"]
    priority: 100
    is_enabled: true

  - key: response_guidelines
    content: "回答规范：使用中文回答，保持专业、简洁、准确；避免使用过于口语化的表达；对于不确定的内容，明确说明'根据现有资料暂无法回答'。"
    scope_root_types: ["all"]
    priority: 90
    is_enabled: true

  - key: knowledge_base_rules
    content: "知识库使用规则：回答必须基于知识库中的资料；如无相关资料，禁止编造答案；引用来源必须在回答末尾标注。"
    scope_root_types: ["company_doc"]
    priority: 80
    is_enabled: true

# ------------------------------
# 系统配置（KV）—— 从 .env 迁移而来
# 首次部署时写入 SystemConfig 表，运行期可在前端系统配置页面修改
# 已存在的 key 不会覆盖 value（保留用户已调整值），仅更新元数据
# 以下项均不含敏感凭证（API Key / 密码 等仍保留在 .env）
# ------------------------------
system_configs:

  # ==================== LLM 配置（category: llm）====================
  # API Key 仍保留在 .env（LLM_API_KEY），此处仅管理模型选择与调用参数
  # base_url 已迁移到模型管理（LLMModel 表），不再作为系统配置项
  - key: LLM_BASE_MODEL
    value: "deepseek-v4-flash"
    value_type: string
    category: llm
    label: "基础模型"
    description: "用于简单任务，节约 token，速度快"
    is_secret: false
    is_readonly: false

  - key: LLM_ADVANCED_MODEL
    value: "deepseek-v4-pro"
    value_type: string
    category: llm
    label: "高级模型"
    description: "用于复杂任务，推理能力强"
    is_secret: false
    is_readonly: false

  - key: LLM_TIMEOUT
    value: 60
    value_type: int
    category: llm
    label: "LLM 调用超时"
    description: ""
    unit: "秒"
    is_secret: false
    is_readonly: false

  # ==================== 知识构建（category: knowledge）====================
  # 图谱抽取 / Wiki 生成开关：关闭时文档解析完成后对应阶段标记"未启用"并跳过
  - key: GRAPH_ENABLED
    value: "true"
    value_type: bool
    category: knowledge
    label: "图谱抽取"
    description: "文档解析完成后是否自动抽取知识图谱（实体/关系），关闭时标记未启用并跳过"
    is_secret: false
    is_readonly: false

  - key: WIKI_ENABLED
    value: "true"
    value_type: bool
    category: knowledge
    label: "Wiki 生成"
    description: "文档解析完成后是否自动生成节点 Wiki 页面，关闭时标记未启用并跳过"
    is_secret: false
    is_readonly: false

  # ==================== OCR 配置（category: knowledge）====================
  # 腾讯云 OCR 凭证（SecretId/SecretKey/Region）属敏感凭证，保留在 .env（TENCENT_OCR_*），不入库
  - key: OCR_ENABLED
    value: "false"
    value_type: bool
    category: knowledge
    label: "OCR 总开关"
    description: "是否启用图片 / 扫描件 PDF 文字识别（需先在 .env 配置腾讯云 OCR 凭证）"
    is_secret: false
    is_readonly: false
    risk_level: high

  - key: OCR_API
    value: "GeneralBasicOCR"
    value_type: string
    category: knowledge
    label: "OCR 接口"
    description: "腾讯云通用印刷体识别接口：GeneralBasicOCR 标准 / GeneralAccurateOCR 高精 / GeneralEfficientOCR 精简（价格更优惠）"
    options:
      - value: GeneralBasicOCR
        label: 通用印刷体（标准）
      - value: GeneralAccurateOCR
        label: 通用印刷体（高精版）
      - value: GeneralEfficientOCR
        label: 通用印刷体（精简版）
    is_secret: false
    is_readonly: false

  - key: OCR_PDF_AUTO
    value: "true"
    value_type: bool
    category: knowledge
    label: "扫描件 PDF 自动 OCR"
    description: "PDF 解析时检测到无文本页（扫描件）是否自动渲染并 OCR，受 OCR_PDF_PAGE_LIMIT 限制"
    is_secret: false
    is_readonly: false

  - key: OCR_PDF_PAGE_LIMIT
    value: 50
    value_type: int
    category: knowledge
    label: "单份 PDF 最大 OCR 页数"
    description: "成本控制：单份扫描件 PDF 最多识别的页数，超出部分跳过"
    unit: "页"
    is_secret: false
    is_readonly: false

  # ==================== Embedding / Rerank（category: embedding）====================
  # API Key 仍保留在 .env（EMBEDDING_API_KEY）
  # base_url 已迁移到模型管理（LLMModel 表），不再作为系统配置项
  - key: EMBEDDING_MODEL
    value: "BAAI/bge-m3"
    value_type: string
    category: embedding
    label: "Embedding 模型名"
    description: ""
    is_secret: false
    is_readonly: false

  - key: EMBEDDING_DIM
    value: 1024
    value_type: int
    category: embedding
    label: "向量维度"
    description: "修改后需重建向量索引，仅限 .env 修改"
    is_secret: false
    is_readonly: true

  - key: RERANK_MODEL
    value: "BAAI/bge-reranker-v2-m3"
    value_type: string
    category: embedding
    label: "Rerank 模型名"
    description: ""
    is_secret: false
    is_readonly: false

  - key: EMBEDDING_PROVIDER
    value: "api"
    value_type: string
    category: embedding
    label: "Embedding Provider"
    description: ""
    options:
      - value: "docker"
        label: "本地优先"
      - value: "api"
        label: "云 API 优先"
    is_secret: false
    is_readonly: false
    risk_level: high

  - key: EMBEDDING_DOCKER_URL
    value: ""
    value_type: string
    category: embedding
    label: "Docker 服务地址"
    description: "EMBEDDING_PROVIDER=docker 时使用"
    is_secret: false
    is_readonly: false

  - key: EMBEDDING_DOCKER_TIMEOUT
    value: 30
    value_type: int
    category: embedding
    label: "Docker 调用超时"
    description: ""
    unit: "秒"
    is_secret: false
    is_readonly: false

  # ==================== 检索参数（category: retrieval）====================
  - key: RETRIEVAL_TOP_K
    value: 20
    value_type: int
    category: retrieval
    label: "混合检索召回 top K"
    description: "向量+BM25 混合检索后合并去重的候选文档数量，再进入 Rerank 阶段"
    is_secret: false
    is_readonly: false

  - key: RETRIEVAL_RERANK_TOP_K
    value: 5
    value_type: int
    category: retrieval
    label: "Rerank 后保留 top K"
    description: "Rerank 重排序后最终返回给 LLM 的文档数量，过大可能引入噪声，过小可能遗漏信息"
    is_secret: false
    is_readonly: false

  - key: HNSW_EF_SEARCH
    value: 40
    value_type: int
    category: retrieval
    label: "HNSW 向量搜索 ef 参数"
    description: "HNSW 索引搜索时的 ef 参数，值越大召回越准但速度越慢，需权衡平衡"
    is_secret: false
    is_readonly: false

  - key: BM25_TOP_K
    value: 30
    value_type: int
    category: retrieval
    label: "BM25 召回 top K"
    description: "BM25 关键词检索召回的候选文档数量，与向量召回合并后进入 Rerank"
    is_secret: false
    is_readonly: false

  - key: VECTOR_TOP_K
    value: 30
    value_type: int
    category: retrieval
    label: "向量召回 top K"
    description: "向量相似度检索召回的候选文档数量，与 BM25 召回合并后进入 Rerank"
    is_secret: false
    is_readonly: false

  - key: RETRIEVAL_MIN_RERANK_SCORE
    value: 0.3
    value_type: float
    category: retrieval
    label: "Rerank 相关性阈值"
    description: "Rerank 重排序后，分数低于该值（0-1）的片段视为与问题无关直接丢弃，防止无关文档作为引用返回；0=不过滤。向量与 BM25 召回的最终相关性统一由该阈值把关"
    is_secret: false
    is_readonly: false

  - key: QUERY_TRANSFORM_ENABLED
    value: false
    value_type: bool
    category: retrieval
    label: "查询改写/分解开关"
    description: "开启后，检索前先对用户 Query 做 LLM 改写/同义词扩展，改写后置信度不足时再拆分为多个子查询分别召回后合并；关闭时行为与现状一致"
    is_secret: false
    is_readonly: false
    risk_level: normal

  - key: QUERY_DECOMPOSE_THRESHOLD
    value: 0.35
    value_type: float
    category: retrieval
    label: "改写后置信度阈值"
    description: "改写后检索结果的置信度低于该值时触发查询分解（0-1），越低越容易触发分解；0.35 大致对应改写后无命中片段"
    is_secret: false
    is_readonly: false
    risk_level: normal

  - key: QUERY_DECOMPOSE_MAX_SUB
    value: 3
    value_type: int
    category: retrieval
    label: "最大子查询数"
    description: "查询分解时最多生成的子查询数量（1-5），防止过度拆分导致检索延迟过高"
    is_secret: false
    is_readonly: false
    risk_level: normal

  - key: PERSONALIZED_RETRIEVAL_ENABLED
    value: false
    value_type: bool
    category: retrieval
    label: "个性化检索开关"
    description: "开启后，基于用户历史问答/画像对检索结果做轻量加权排序（默认影响≤10%）；关闭时行为与现状完全一致，冷启动用户无副作用"
    is_secret: false
    is_readonly: false
    risk_level: normal

  - key: PERSONALIZED_WEIGHT
    value: 0.1
    value_type: float
    category: retrieval
    label: "个性化加权系数"
    description: "个性化排序加权系数（0-0.2，默认 0.1 即影响不超过 10%）。数值越大个性化对排序影响越明显，过高会导致画像污染全局检索结果"
