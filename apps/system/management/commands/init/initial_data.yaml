  # --- 生产对话自动评估（内联采样 + 限速）---
  - key: PRODUCTION_EVAL_ENABLED
    value: false
    value_type: bool
    category: eval
    label: "生产对话采样评估"
    description: "默认关闭，按需开启"
    is_secret: false
    is_readonly: false
    risk_level: high

  - key: PRODUCTION_EVAL_SAMPLE_RATE
    value: 0.05
    value_type: float
    category: eval
    label: "采样率"
    description: "随机对未评估的对话进行自动评估的比例，0=不评估，1=全量评估"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_RATE_PER_MIN
    value: 5
    value_type: int
    category: eval
    label: "每分钟评估上限"
    description: "仅限当前分钟内已发起对话的评估并发数，主要防止突发请求打爆 LLM 评估接口。"
    unit: "次/分"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_RATE_PER_HOUR
    value: 50
    value_type: int
    category: eval
    label: "每小时评估上限"
    description: "仅限当前小时内已发起对话的评估总量，将当天的评估对象分散到不同小时，避免集中在某一时段。"
    unit: "次/时"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_BATCH_SIZE
    value: 10
    value_type: int
    category: eval
    label: "2h 批量回扫每次评估条数"
    description: "每 2 小时回扫未评估的历史对话进行批量评估，每次处理的条数"
    unit: "条"
    is_secret: false
    is_readonly: false

  # 评估维度：评估=展示强绑定，勾选的维度既参与 LLM 评估也在看板展示，未勾选的维度不评估也不展示。
  # 降本场景可只勾选核心维度（如 faithfulness + answer_relevancy），默认全选 12 维。
  - key: EVAL_DISPLAY_DIMENSIONS
    value: "faithfulness,hallucination,answer_relevancy,context_relevancy,toxicity,bias,completeness,conciseness,clarity,professionalism,helpfulness,actionability"
    value_type: string
    category: eval
    label: "评估维度"
    description: "多选，评估=展示强绑定：勾选的维度既参与 LLM 评估也在 admin-eval「回答质量」页展示，未勾选的维度不评估也不展示。默认全选 12 维。降本场景可只勾选核心维度（如 faithfulness + answer_relevancy）"
    options:
      - value: "faithfulness"
        label: "忠实度 (faithfulness)"
      - value: "hallucination"
        label: "幻觉 (hallucination)"
      - value: "answer_relevancy"
        label: "回答相关性 (answer_relevancy)"
      - value: "context_relevancy"
        label: "检索相关性 (context_relevancy)"
      - value: "toxicity"
        label: "毒性 (toxicity)"
      - value: "bias"
        label: "偏见 (bias)"
      - value: "completeness"
        label: "完整性 (completeness)"
      - value: "conciseness"
        label: "简洁性 (conciseness)"
      - value: "clarity"
        label: "清晰度 (clarity)"
      - value: "professionalism"
        label: "专业性 (professionalism)"
      - value: "helpfulness"
        label: "有用性 (helpfulness)"
      - value: "actionability"
        label: "可操作性 (actionability)"
    is_secret: false
    is_readonly: false

# ------------------------------
# 模型配置（LLM / Embedding / Rerank）
# 仅管理调用所需的 base_url / model_name / provider 等非敏感元数据，
# API Key 仍保留在 .env 中。首次部署时写入 LLMModel 表，前端模型管理弹窗可 CRUD。
# 已存在的 (model_type, name) 组合不会重复创建（unique_together 约束）。
# ------------------------------
llm_models:
  - name: "DeepSeek 对话"
    provider: "deepseek"
    model_type: "llm"
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-chat"
    is_active: true

  - name: "DeepSeek 推理"
    provider: "deepseek"
    model_type: "llm"
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-reasoner"
    is_active: true

  # Embedding / Rerank 走 SiliconFlow，与 SystemConfig.EMBEDDING_MODEL / RERANK_MODEL 对齐
  # model_name 必须与 SystemConfig 中的值完全一致，否则 config_loader 反查不到 base_url
  - name: "BGE-M3 Embedding"
    provider: "siliconflow"
    model_type: "embedding"
    base_url: "https://api.siliconflow.cn/v1"
    model_name: "BAAI/bge-m3"
