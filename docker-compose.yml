  #   healthcheck:
  #     test: ["CMD", "redis-cli", "-a", "${REDIS_DB_PASSWORD}", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  django:
    build: .
    container_name: rag_django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: rag_project.settings
      PG_DB_HOST: postgres
      REDIS_DB_HOST: redis
      TZ: Asia/Shanghai
    volumes:
      - .:/app
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    command: ["/app/entrypoint.sh"]
    networks:
      - data_network

  celery-worker:
    build: .
    container_name: rag_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: rag_project.settings
      PG_DB_HOST: postgres
      REDIS_DB_HOST: redis
      TZ: Asia/Shanghai
    volumes:
      - .:/app
    command: ["celery", "-A", "rag_project", "worker", "-l", "info", "-Q", "default,parse,memory,email,analytics", "--concurrency=1"]
    networks:
      - data_network

  celery-beat:
    build: .
    container_name: rag_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: rag_project.settings
      PG_DB_HOST: postgres
      REDIS_DB_HOST: redis
      TZ: Asia/Shanghai
    volumes:
      - .:/app
    command: ["celery", "-A", "rag_project", "beat", "-l", "info"]
    networks:
      - data_network

