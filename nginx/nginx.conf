# ==========================================================================
# RAG-Agent nginx 反向代理配置
# 对外暴露 80 端口：静态资源由 nginx 直接服务，其余请求反向代理到内部 django:8000
# 静态/上传文件来自具名卷（static_data / media_data），与 django 容器共享
# ==========================================================================

# 后端 Django 服务（docker 内部网络，服务名 django）
upstream django_backend {
    server django:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 文档上传/下载大小上限（与 SystemConfig DOCUMENT_MAX_SIZE_MB 保持同量级）
    client_max_body_size 200m;

    # 前端静态资源（collectstatic 产物，挂载 static_data 卷）
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        access_log off;
    }

    # 上传文件（挂载 media_data 卷）
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        access_log off;
    }

    # 其余请求（SPA 页面 / API）统一反代到 Django
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
