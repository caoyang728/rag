[pytest]
DJANGO_SETTINGS_MODULE = rag_project.test_settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 串行执行：禁用 pytest-xdist 并行，配合 conftest.py 的 1 秒间隔
# --reuse-db：复用测试数据库，避免每次运行重建（schema 变更时用 --create-db 强制重建）
# 低内存/低 IOPS 机器上重建测试库会触发大量 PG 磁盘写入，是 IOPS 飙升的主因之一
addopts = -v --tb=short -p no:xdist --reuse-db
markers =
    unit: Unit tests (no DB or minimal DB)
    integration: Integration / API tests
    slow: Slow tests (external services, large datasets)
    smoke: Smoke tests for CI gate (fast, core connectivity)
    django_db: Database-required tests (provided by pytest-django)

[coverage:run]
source = apps
omit = */tests/*, */migrations/*
