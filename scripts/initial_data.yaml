# ==========================================================================
# 系统初始化配置文件
# 使用方法：python scripts/init_system.py
# 首次部署时运行，创建必要的账号、角色、权限、部门等基础数据
# ==========================================================================

# ------------------------------
# 初始超级管理员账号
# 其他用户由超级管理员登录后在系统中创建
# ------------------------------
users:
  - username: admin
    email: admin@example.com
    real_name: 系统管理员
    password: Admin@1234
    role: super_admin

# ------------------------------
# 系统内置角色
# ------------------------------
roles:
  - code: super_admin
    name: 超级管理员
    description: 全部配置权限、绕过双审直接发布、可物理销毁文档
    is_builtin: true

  - code: dept_manager
    name: 部门负责人
    description: 管辖本部门全部团队、审批扩大可见范围申请
    is_builtin: true

  - code: team_leader
    name: 团队组长
    description: 本团队文档一审、管理文档、调整可见范围、直接收回对外权限
    is_builtin: true

  - code: compliance_reviewer
    name: 文档审核员
    description: 专职合规风控、敏感内容二审校验、无日常检索问答权限
    is_builtin: true

  - code: employee
    name: 普通员工
    description: 检索已审核文档、上传发起双审工单、发起权限申请
    is_builtin: true

  - code: readonly
    name: 只读员工
    description: 检索已发布文档、发起read权限申请、禁止上传
    is_builtin: true

  # ---- 权限拆分（超级管理员权力拆分，避免单人权限过大） ----
  # TODO: 后续可实现双路校验（super_admin + kb_admin / user_admin 联合审批关键操作）
  - code: kb_admin
    name: 知识库管理员
    description: 管理全部文档（CRUD/审核/授权/删除/恢复），可操作节点树。注：不包含用户管理权限
    is_builtin: true

  - code: user_admin
    name: 用户管理员
    description: 管理全部用户（CRUD/角色分配/部门团队），可配置系统参数。注：不包含文档管理权限
    is_builtin: true

# ------------------------------
# 系统内置权限
# ------------------------------
permissions:
  # 知识库权限 - read
  - code: knowledge:read:all
    name: 知识库全局只读
    module: knowledge
    action: read
    scope: all

  - code: knowledge:read:department
    name: 知识库部门只读
    module: knowledge
    action: read
    scope: department

  - code: knowledge:read:team
    name: 知识库团队只读
    module: knowledge
    action: read
    scope: team

  # 知识库权限 - upload
  - code: knowledge:upload:all
    name: 全局上传文档
    module: knowledge
    action: upload
    scope: all

  - code: knowledge:upload:department
    name: 部门上传文档
    module: knowledge
    action: upload
    scope: department

  - code: knowledge:upload:team
    name: 团队上传文档
    module: knowledge
    action: upload
    scope: team

  # 知识库权限 - manage
  - code: knowledge:manage:all
    name: 全局文档管理
    module: knowledge
    action: manage
    scope: all

  - code: knowledge:manage:department
    name: 部门文档管理
    module: knowledge
    action: manage
    scope: department

  - code: knowledge:manage:team
    name: 团队文档管理
    module: knowledge
    action: manage
    scope: team

  # 知识库权限 - download
  - code: knowledge:download:all
    name: 全局下载文档
    module: knowledge
    action: download
    scope: all

  - code: knowledge:download:department
    name: 部门下载文档
    module: knowledge
    action: download
    scope: department

  - code: knowledge:download:team
    name: 团队下载文档
    module: knowledge
    action: download
    scope: team

  # 用户管理权限
  - code: user:manage_users:all
    name: 全局用户管理
    module: user
    action: manage_users
    scope: all

  - code: user:manage_users:department
    name: 部门用户管理
    module: user
    action: manage_users
    scope: department

  - code: user:manage_users:team
    name: 团队用户管理
    module: user
    action: manage_users
    scope: team

  # 系统配置权限
  - code: system:config:all
    name: 系统配置
    module: system
    action: config
    scope: all

  # 审计日志权限
  - code: audit:read:all
    name: 审计日志全局只读
    module: audit
    action: read
    scope: all

  # 运营分析权限 - 系统级（全平台报表/队列监控/实时监控）
  - code: analytics:system:read
    name: 运营分析系统只读
    module: analytics
    action: system_read
    scope: all

  - code: analytics:system:write
    name: 运营分析系统写（关键词/反馈状态管理）
    module: analytics
    action: system_write
    scope: all

  # 运营分析权限 - 组织级（部门/团队统计报表）
  - code: analytics:org:read
    name: 运营分析组织只读（部门经理/团队负责人查看本组织报表）
    module: analytics
    action: org_read
    scope: department

  - code: analytics:org:write
    name: 运营分析组织写（预留）
    module: analytics
    action: org_write
    scope: department

# ------------------------------
# 角色-权限映射
# ------------------------------
role_permissions:
  super_admin:
    - knowledge:read:all
    - knowledge:upload:all
    - knowledge:manage:all
    - knowledge:download:all
    - user:manage_users:all
    - system:config:all
    - audit:read:all
    - analytics:system:read
    - analytics:system:write
    - analytics:org:read
    - analytics:org:write

  dept_manager:
    - knowledge:read:all
    - knowledge:upload:all
    - knowledge:manage:department
    - knowledge:download:all
    - user:manage_users:department
    - analytics:org:read

  team_leader:
    - knowledge:read:all
    - knowledge:upload:all
    - knowledge:manage:team
    - knowledge:download:all
    - user:manage_users:team
    - analytics:org:read

  compliance_reviewer:
    - knowledge:upload:all

  employee:
    - knowledge:read:all
    - knowledge:upload:all

  readonly:
    - knowledge:read:all

  # kb_admin：管文档不管用户，权限对标 super_admin 的知识库部分
  kb_admin:
    - knowledge:read:all
    - knowledge:upload:all
    - knowledge:manage:all
    - knowledge:download:all

  # user_admin：管用户不管文档，权限对标 super_admin 的用户管理部分
  user_admin:
    - user:manage_users:all
    - system:config:all

# ------------------------------
# 全局记忆（公司规则）
# ------------------------------
global_memories:
  - key: company_rules
    content: "公司内部信息安全规范：禁止泄露公司机密数据、客户信息、财务数据等敏感信息。所有回答必须严格遵守公司保密制度。"
    scope_root_types: ["all"]
    priority: 100
    is_enabled: true

  - key: response_guidelines
    content: "回答规范：使用中文回答，保持专业、简洁、准确；避免使用过于口语化的表达；对于不确定的内容，明确说明'根据现有资料暂无法回答'。"
    scope_root_types: ["all"]
    priority: 90
    is_enabled: true

  - key: knowledge_base_rules
    content: "知识库使用规则：回答必须基于知识库中的资料；如无相关资料，禁止编造答案；引用来源必须在回答末尾标注。"
    scope_root_types: ["company_doc"]
    priority: 80
    is_enabled: true

