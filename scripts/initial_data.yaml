    is_secret: false
    is_readonly: false

  # ==================== Agent（category: agent）====================
  - key: AGENT_DEFAULT_MODE
    value: "auto"
    value_type: string
    category: agent
    label: "默认问答模式"
    description: ""
    options:
      - value: "auto"
        label: "Agent 自主决策"
      - value: "rag"
        label: "传统 RAG"
      - value: "agent"
        label: "强制 Agent"
    is_secret: false
    is_readonly: true

  - key: BUSINESS_DB_TABLES
    value: ""
    value_type: string
    category: agent
    label: "Text2SQL 白名单"
    description: "多选，空=全部表"
    is_secret: false
    is_readonly: false

  # ==================== 安全（category: security）====================
  - key: SENSITIVE_FILTER_ENABLED
    value: true
    value_type: bool
    category: security
    label: "敏感词审查"
    description: "输出侧内容安全防线"
    is_secret: false
    is_readonly: false
    risk_level: high

  - key: SENSITIVE_FILTER_CHUNK_SIZE
    value: 32
    value_type: int
    category: security
    label: "审查累积字符数"
    description: "过小增开销，过大延迟感知违规"
    unit: "字符"
    is_secret: false
    is_readonly: false

  - key: SENSITIVE_FILTER_WINDOW_SIZE
    value: 16
    value_type: int
    category: security
    label: "滑动窗口大小"
    description: "保留尾部 N 字符防止关键词被边界切分"
    unit: "字符"
    is_secret: false
    is_readonly: false

  - key: SENSITIVE_FILTER_MASK_STR
    value: "***"
    value_type: string
    category: security
    label: "脱敏替换字符串"
    description: ""
    is_secret: false
    is_readonly: false

  - key: SENSITIVE_FILTER_RELOAD_TTL
    value: 300
    value_type: int
    category: security
    label: "词库缓存 TTL"
    description: "超过后自动从 DB 刷新"
    unit: "秒"
    is_secret: false
    is_readonly: false

  - key: MAX_LOGIN_FAIL
    value: 5
    value_type: int
    category: security
    label: "登录失败次数"
    description: "超过锁定账号"
    is_secret: false
    is_readonly: false
    risk_level: high

  - key: BAN_DURATION_MIN
    value: 15
    value_type: int
    category: security
    label: "登录锁定时长"
    description: ""
    unit: "分钟"
    is_secret: false
    is_readonly: false
    risk_level: high

  # ==================== 记忆（category: memory）====================
  - key: MEMORY_TOKEN_BUDGET
    value: 8000
    value_type: int
    category: memory
    label: "记忆 Token 预算"
    description: ""
    unit: "tokens"
    is_secret: false
    is_readonly: false

  - key: SHORT_TERM_TTL
    value: 3600
    value_type: int
    category: memory
    label: "短时记忆 TTL"
    description: ""
    unit: "秒"
    is_secret: false
    is_readonly: false

  - key: SHORT_TERM_MAX_TURNS
    value: 6
    value_type: int
    category: memory
    label: "短时记忆最大保留轮数"
    description: ""
    is_secret: false
    is_readonly: false

  # ==================== Analytics（category: analytics）====================
  - key: ANALYTICS_REDIS_DB
    value: 3
    value_type: int
    category: analytics
    label: "统计专用 Redis"
    description: "避免与 Celery broker/result backend 冲突"
    is_secret: false
    is_readonly: false

  - key: QUEUE_MONITOR_ENABLED
    value: true
    value_type: bool
    category: analytics
    label: "是否启用队列深度监控"
    description: ""
    is_secret: false
    is_readonly: false

  # ==================== 评估（category: eval）====================
  - key: EVAL_ENABLED
    value: true
    value_type: bool
    category: eval
    label: "启用评估"
    description: "控制是否允许发起评估任务（含手动和定时），关闭可节省成本"
    is_secret: false
    is_readonly: false

  - key: EVAL_DAILY_LIMIT
    value: 500
    value_type: int
    category: eval
    label: "每日评估上限"
    description: "每日最多发起评估的对话条数"
    unit: "次"
    is_secret: false
    is_readonly: false

  - key: EVAL_MODEL
    value: "deepseek-v4-flash"
    value_type: string
    category: eval
    label: "评估所用模型"
    description: ""
    is_secret: false
    is_readonly: false

  - key: EVAL_COST_LIMIT
    value: 2.0
    value_type: float
    category: eval
    label: "每日评估成本上限"
    description: "每日评估 LLM 调用成本上限"
    unit: "元"
    is_secret: false
    is_readonly: false

  # --- 低分回归测试集 ---
  - key: LOW_SCORE_REGRESSION_ENABLED
    value: true
    value_type: bool
    category: eval
    label: "低分回归"
    description: "关闭后定时任务跳过，手动触发仍可用"
    is_secret: false
    is_readonly: false

  - key: LOW_SCORE_REGRESSION_TOP_N
    value: 50
    value_type: int
    category: eval
    label: "低分沉淀数量"
    description: "每次从历史评估中取低分 N 条沉淀到回归测试集"
    unit: "条"
    is_secret: false
    is_readonly: false

  - key: LOW_SCORE_REGRESSION_PASS_THRESHOLD
    value: 0.7
    value_type: float
    category: eval
    label: "回归通过阈值"
    description: "回归评估 12 维均分 ≥ 此值视为通过"
    is_secret: false
    is_readonly: false

  - key: LOW_SCORE_REGRESSION_CAPACITY
    value: 200
    value_type: int
    category: eval
    label: "回归测试集容量"
    description: "低分回归测试集的最大保留条数，超出时自动淘汰"
    unit: "条"
    is_secret: false
    is_readonly: false

  - key: LOW_SCORE_REGRESSION_SUGGEST_REMOVE_PASSES
    value: 3
    value_type: int
    category: eval
    label: "建议移除通过数"
    description: "连续通过次数达到该值时前端提示建议人工 review 移除"
    is_secret: false
    is_readonly: false

  # --- 生产对话自动评估（内联采样 + 限速）---
  - key: PRODUCTION_EVAL_ENABLED
    value: false
    value_type: bool
    category: eval
    label: "生产对话采样评估"
    description: "默认关闭，按需开启"
    is_secret: false
    is_readonly: false
    risk_level: high

  - key: PRODUCTION_EVAL_SAMPLE_RATE
    value: 0.05
    value_type: float
    category: eval
    label: "采样率"
    description: "生产对话触发评估的概率，0=不评估，1=全量评估"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_RATE_PER_MIN
    value: 10
    value_type: int
    category: eval
    label: "每分钟评估上限"
    description: "令牌桶限速"
    unit: "次/分"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_HOURLY_GUARANTEE
    value: 10
    value_type: int
    category: eval
    label: "每小时保底条数"
    description: "保证低流量初期也有即时质量信号"
    unit: "条/时"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_DAILY_GUARANTEE
    value: 50
    value_type: int
    category: eval
    label: "每日保底上限"
    description: "防止高流量下保底成本失控"
    unit: "条/日"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_BATCH_SIZE
    value: 10
    value_type: int
    category: eval
    label: "2h 批量回扫每次评估条数"
    description: ""
    unit: "条"
    is_secret: false
    is_readonly: false

  - key: PRODUCTION_EVAL_METRIC_GROUPS
    value: "all"
    value_type: string
    category: eval
    label: "评估指标组"
    description: "多选，逗号分隔组合"
    options:
      - value: "all"
        label: "全部"
      - value: "core"
        label: "核心"
      - value: "retrieval"
        label: "检索"
      - value: "safety"
        label: "安全"
      - value: "quality"
        label: "质量"
      - value: "business"
        label: "业务"
    is_secret: false
    is_readonly: false

# ------------------------------
# 模型配置（LLM / Embedding / Rerank）
# 仅管理调用所需的 base_url / model_name / provider 等非敏感元数据，
# API Key 仍保留在 .env 中。首次部署时写入 LLMModel 表，前端模型管理弹窗可 CRUD。
# 已存在的 (model_type, name) 组合不会重复创建（unique_together 约束）。
# ------------------------------
llm_models:
  - name: "DeepSeek 对话"
    provider: "deepseek"
    model_type: "llm"
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-chat"
    is_active: true

  - name: "DeepSeek 推理"
    provider: "deepseek"
    model_type: "llm"
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-reasoner"
    is_active: true

  # Embedding / Rerank 走 SiliconFlow，与 SystemConfig.EMBEDDING_MODEL / RERANK_MODEL 对齐
  # model_name 必须与 SystemConfig 中的值完全一致，否则 config_loader 反查不到 base_url
  - name: "BGE-M3 Embedding"
    provider: "siliconflow"
    model_type: "embedding"
    base_url: "https://api.siliconflow.cn/v1"
    model_name: "BAAI/bge-m3"
    is_active: true

  - name: "BGE-Reranker-v2-m3"
    provider: "siliconflow"
    model_type: "rerank"
    base_url: "https://api.siliconflow.cn/v1"
    model_name: "BAAI/bge-reranker-v2-m3"
    is_active: true

