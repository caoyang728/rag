<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>审计与安全 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/admin-audit.css">
</head>

<body>
	<div id="topnav-container"></div>

	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header">
				<div class="flex items-baseline gap-10">
					<div class="page-title">审计日志与安全</div>
					<div class="page-subtitle">全链路操作留痕，IP 黑白名单管控，登录异常追踪</div>
				</div>
			</div>
			<div class="card p-0 flex flex-col overflow-hidden" style="flex:1;min-height:0">
				<div class="tabs">
					<div class="tab-item active" onclick="setAuditTab('audit')">📋 审计日志</div>
					<div class="tab-item" onclick="setAuditTab('white')">✅ IP 白名单</div>
					<div class="tab-item" onclick="setAuditTab('black')">🚫 IP 黑名单</div>
					<div class="tab-item" onclick="setAuditTab('sensitive')">🛡️ 敏感词</div>
					<div class="tab-item" onclick="setAuditTab('login')">🔐 登录尝试</div>
				</div>
				<div id="auditBody"></div>
			</div>
		</div>
	</div>

	<!-- ===== Templates ===== -->
	<template id="tmpl-audit-tab">
		<div class="audit-filter-bar flex gap-8 shrink-0 flex-wrap items-center">
			<input class="input audit-filter-username" style="width:180px" placeholder="🔍 用户名">
			<select class="select audit-filter-action" style="width:150px">
				<option value="">全部操作类型</option>
				<option value="login">登录</option>
				<option value="upload_document">上传</option>
				<option value="delete_document">删除</option>
				<option value="update_user">用户变更</option>
				<option value="toggle_user_status">启禁用</option>
				<option value="export">导出</option>
				<option value="create_node">知识库</option>
				<option value="chat_ask">问答</option>
				<option value="manage_whitelist">白名单</option>
				<option value="manage_blacklist">黑名单</option>
				<option value="manage_sensitive_word">敏感词</option>
			</select>
			<input class="input audit-filter-ip" style="width:200px" placeholder="🌐 IP 地址">
			<input class="input audit-filter-start" type="date" style="width:150px">
			<span style="align-self:center">至</span>
			<input class="input audit-filter-end" type="date" style="width:150px">
			<button class="btn btn-primary btn-sm audit-btn-query" style="width:72px">查询</button>
			<button class="btn btn-sm audit-btn-reset" style="width:72px">重置</button>
			<span style="flex:1"></span>
			<button class="btn btn-primary btn-sm" onclick="exportAuditLogs()">📥 导出 Excel</button>
		</div>
		<div class="card-scroll">
			<table class="table" style="border:1px solid var(--border);border-radius:var(--radius)">
				<thead>
					<tr>
						<th>时间</th>
						<th>用户</th>
						<th>操作类型</th>
						<th>资源</th>
						<th>IP 地址</th>
						<th>结果</th>
						<th>详情</th>
					</tr>
				</thead>
				<tbody class="audit-tbody"></tbody>
			</table>
		</div>
		<div class="pagination audit-pagination shrink-0"></div>
	</template>

	<template id="tmpl-whitelist-tab">
		<div class="flex justify-between items-center shrink-0">
			<div class="tab-info-bar whitelist-info">
				<span class="tab-info-icon">✅</span>
				<span>命中白名单的 IP 直接放行（即使同 IP 也在黑名单中）；白名单外的 IP 会继续检查黑名单；都不命中则默认放行，共 <span class="tab-info-count">0</span> 条规则</span>
			</div>
			<button class="btn btn-primary btn-sm" onclick="showAddWhitelist()" style="margin-right:8px">＋ 新增白名单</button>
		</div>
		<div class="card-scroll">
			<table class="table" style="border:1px solid var(--border);border-radius:var(--radius)">
				<thead>
					<tr>
						<th>IP / CIDR</th>
						<th>说明</th>
						<th>添加人</th>
						<th>添加时间</th>
						<th style="width:140px">操作</th>
					</tr>
				</thead>
				<tbody class="whitelist-tbody"></tbody>
			</table>
		</div>
		<div class="pagination whitelist-pagination shrink-0"></div>
	</template>

	<template id="tmpl-blacklist-tab">
		<div class="flex justify-between items-center shrink-0">
			<div class="tab-info-bar">
				<span class="tab-info-icon">🚫</span>
				<span>黑名单 IP 将被<strong style="color:var(--danger)">永久拒绝</strong>访问（但若同 IP 也在白名单中则优先放行），登录失败 5 次自动封禁 15 分钟</span>
			</div>
			<button class="btn btn-primary btn-sm" onclick="showAddBlacklist()" style="margin-right:8px">＋ 手动封禁</button>
		</div>
		<div class="card-scroll">
			<table class="table" style="border:1px solid var(--border);border-radius:var(--radius)">
				<thead>
					<tr>
						<th>IP 地址</th>
						<th>封禁原因</th>
						<th>操作人</th>
						<th>封禁时间</th>
						<th>解封时间</th>
						<th style="width:120px">操作</th>
					</tr>
				</thead>
				<tbody class="blacklist-tbody"></tbody>
			</table>
		</div>
		<div class="pagination blacklist-pagination shrink-0"></div>
	</template>

	<!-- 敏感词管理 tab：列表 + 新增/编辑/删除
		字段说明：
		- 动作 action：mask=脱敏（替换为***）/ block=拦截（中断流式）/ warn=仅告警
		- 分类 category：用于审计归类，不影响处理逻辑
		- 新增/编辑统一走 #modal-sensitive 弹窗（word 和 category 仅新增时可编辑）
	-->
	<template id="tmpl-sensitive-tab">
		<div class="flex justify-between items-center shrink-0">
			<div class="tab-info-bar">
				<span class="tab-info-icon">🛡️</span>
				<span>LLM 输出实时审查词库 — 命中 <span class="badge badge-danger" style="font-size:11px">block</span> 立即中断流式，<span class="badge badge-warn" style="font-size:11px">mask</span> 脱敏后下发，<span class="badge badge-info" style="font-size:11px">warn</span> 仅记录告警；命中次数为累计命中统计</span>
			</div>
			<button class="btn btn-primary btn-sm" onclick="showAddSensitive()" style="margin-right:8px">＋ 新增敏感词</button>
		</div>
		<div class="card-scroll">
			<table class="table" style="border:1px solid var(--border);border-radius:var(--radius)">
				<thead>
					<tr>
						<th>敏感词</th>
						<th>分类</th>
						<th>动作</th>
						<th>命中次数</th>
						<th>正则</th>
						<th>启用</th>
						<th>添加时间</th>
						<th style="width:140px">操作</th>
					</tr>
				</thead>
				<tbody class="sensitive-tbody"></tbody>
			</table>
		</div>
		<div class="pagination sensitive-pagination shrink-0"></div>
	</template>

	<template id="tmpl-login-tab">
		<div class="tab-info-bar shrink-0">
			<span class="tab-info-icon">🔐</span>
			<span>近 24 小时登录尝试记录，异常尝试将<strong style="color:var(--danger)">自动加入黑名单</strong></span>
		</div>
		<div class="audit-filter-bar flex gap-8 shrink-0 flex-wrap items-center">
			<input class="input login-filter-username" style="width:160px" placeholder="🔍 用户名">
			<input class="input login-filter-ip" style="width:180px" placeholder="🌐 IP 地址">
			<select class="select login-filter-result" style="width:130px">
				<option value="">全部结果</option>
				<option value="success">成功</option>
				<option value="wrong_password">失败</option>
			</select>
			<button class="btn btn-primary btn-sm" onclick="filterLoginAttempts()">查询</button>
			<button class="btn btn-sm" onclick="resetLoginFilter()">重置</button>
			<span style="flex:1"></span>
			<button class="btn btn-primary btn-sm" onclick="exportLoginAttempts()">📥 导出 Excel</button>
		</div>
		<div class="card-scroll">
			<table class="table" style="border:1px solid var(--border);border-radius:var(--radius)">
				<thead>
					<tr>
						<th>时间</th>
						<th>用户</th>
						<th>IP 地址</th>
						<th>User-Agent</th>
						<th>结果</th>
						<th>失败原因</th>
					</tr>
				</thead>
				<tbody class="login-tbody"></tbody>
			</table>
		</div>
		<div class="pagination login-pagination shrink-0"></div>
	</template>

	<template id="tmpl-audit-detail">
		<div class="grid-2 audit-detail-grid" style="gap:8px 20px;font-size:13px">
			<div class="text-sub">时间</div>
			<div class="audit-detail-time"></div>
			<div class="text-sub">用户</div>
			<div class="audit-detail-user"></div>
			<div class="text-sub">操作</div>
			<div class="audit-detail-action"></div>
			<div class="text-sub">资源</div>
			<div class="audit-detail-resource"></div>
			<div class="text-sub">IP 地址</div>
			<div class="audit-detail-ip"></div>
			<div class="text-sub">结果</div>
			<div class="audit-detail-result"></div>
		</div>
		<div class="mt-16">
			<div class="text-sub text-sm mb-8">上下文 JSON</div>
			<pre style="background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:var(--radius);font-family:'Courier New',monospace;font-size:12px;line-height:1.6;overflow-x:auto"
				id="audit-json-block"></pre>
		</div>
	</template>

	<!-- 审计详情弹窗 -->
	<div class="modal" id="modal-audit">
		<div class="modal-header">
			<div class="modal-title" id="modal-audit-title">审计详情</div>
			<button class="modal-close" onclick="closeAllOverlays()">✕</button>
		</div>
		<div class="modal-body" id="modal-audit-body"></div>
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeAllOverlays()">关闭</button>
			<button class="btn-save" onclick="copyAuditJson()">复制 JSON</button>
		</div>
	</div>

	<!-- 敏感词新增/编辑弹窗
		新增：word + category + action + is_regex 可编辑
		编辑：仅 action + is_enabled 可编辑（后端 PUT 限制），word/category 显示但禁用
	-->
	<div class="modal modal-sm" id="modal-sensitive" style="width:520px">
		<div class="modal-header">
			<div class="modal-title" id="modal-sensitive-title">新增敏感词</div>
			<button class="modal-close" onclick="closeAllOverlays()">✕</button>
		</div>
		<div class="modal-body">
			<div class="sensitive-action-guide">
				<div class="sensitive-action-item sensitive-action-block">
					<span class="sensitive-action-badge">block</span>
					<span>命中立即中断流式输出</span>
				</div>
				<div class="sensitive-action-item sensitive-action-mask">
					<span class="sensitive-action-badge">mask</span>
					<span>替换为 *** 后下发</span>
				</div>
				<div class="sensitive-action-item sensitive-action-warn">
					<span class="sensitive-action-badge">warn</span>
					<span>仅记录告警日志</span>
				</div>
			</div>
			<form id="form-sensitive" autocomplete="off">
				<div class="form-item">
					<label class="form-label">敏感词 <span class="required">*</span></label>
					<input class="input sensitive-input-word" type="text" maxlength="128" placeholder="输入敏感词（最长 128 字符）">
				</div>
				<div class="form-row">
					<div class="form-item" style="flex:1">
						<label class="form-label">分类</label>
						<select class="select sensitive-input-category" style="width:100%">
							<option value="other">其它</option>
							<option value="phone">手机号</option>
							<option value="id_card">身份证</option>
							<option value="email">邮箱</option>
							<option value="bank_card">银行卡</option>
							<option value="secret">内部机密</option>
						</select>
					</div>
					<div class="form-item" style="flex:1">
						<label class="form-label">处理动作</label>
						<select class="select sensitive-input-action" style="width:100%">
							<option value="mask">mask · 脱敏替换</option>
							<option value="block">block · 拦截中断</option>
							<option value="warn">warn · 仅告警</option>
						</select>
					</div>
				</div>
				<div class="form-item" style="margin-bottom:0">
					<label class="form-label">选项</label>
					<div class="flex gap-16 items-center">
						<label class="flex items-center gap-4 sensitive-toggle-label">
							<input class="sensitive-input-regex" type="checkbox">
							<span>正则表达式</span>
						</label>
						<label class="flex items-center gap-4 sensitive-toggle-label">
							<input class="sensitive-input-enabled" type="checkbox" checked>
							<span>启用</span>
						</label>
					</div>
				</div>
			</form>
		</div>
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeAllOverlays()">取消</button>
			<button class="btn-save" onclick="saveSensitive()">保存</button>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/admin-audit.js"></script>
</body>

</html>
