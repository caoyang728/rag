<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>组织架构管理 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/admin-org.css">
</head>

<body>
	<div id="topnav-container"></div>
	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header">
				<div class="flex items-baseline gap-10">
					<div class="page-title">组织架构管理</div>
					<div class="page-subtitle">管理组织架构（部门/团队）</div>
				</div>
			</div>

			<!-- ===== 部门管理 ===== -->
			<div class="card flex flex-col overflow-hidden" style="flex:1;min-height:0">
				<div class="flex items-center justify-between mb-16 shrink-0">
					<div class="card-title mb-0">部门管理</div>
					<button class="btn btn-primary btn-sm" id="btnAddDept" onclick="openDeptModal()">＋ 新增部门</button>
				</div>
				<div id="deptList" class="card-scroll"></div>
			</div>
		</div>
	</div>

	<!-- ===== 部门 Modal ===== -->
	<div class="modal" id="deptModal" style="width:460px">
		<div class="modal-header">
			<div class="modal-title" id="deptModalTitle">新增部门</div>
			<button class="modal-close" onclick="closeModal('deptModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh">
			<input type="hidden" id="deptId">
			<div class="form-item">
				<label class="form-label">部门名称 <span class="required">*</span></label>
				<input id="deptName" class="input" placeholder="如: 研发部">
			</div>
			<div class="form-item">
				<label class="form-label">编码 <span class="form-hint">（留空自动生成拼音首字母）</span></label>
				<input id="deptCode" class="input" placeholder="如: yfb">
			</div>
			<div class="form-item">
				<label class="form-label">部门经理</label>
				<div class="relative">
					<input id="deptLeaderSearch" class="input" placeholder="搜索用户姓名..." autocomplete="off"
						oninput="searchDeptLeader()" onfocus="searchDeptLeader()">
					<div id="deptLeaderResults" class="dropdown-menu"></div>
				</div>
				<input type="hidden" id="deptLeaderId">
			</div>
		</div>
		<div class="modal-footer">
			<button class="btn btn-sm btn-outline" onclick="closeModal('deptModal')">取消</button>
			<button class="btn btn-sm btn-primary" onclick="saveDept()">保存</button>
		</div>
	</div>

	<!-- ===== 团队管理 Modal ===== -->
	<div class="modal" id="teamManageModal" style="width:560px">
		<div class="modal-header">
			<div class="modal-title" id="teamManageModalTitle">管理团队</div>
			<button class="modal-close" onclick="closeModal('teamManageModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh">
			<div id="teamManageList"></div>
		</div>
		<div class="modal-footer" style="justify-content: space-between;">
			<button class="btn btn-primary btn-sm" onclick="openTeamForm()">＋ 新增团队</button>
			<button class="btn btn-sm btn-outline" onclick="closeModal('teamManageModal')">关闭</button>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<!-- ===== 模板 ===== -->
	<template id="tmpl-no-permission">
		<div class="flex items-center justify-center flex-col" style="height:100vh;color:var(--text-sub)">
			<div style="font-size:48px;margin-bottom:16px">&#128274;</div>
			<div style="font-size:16px">仅超级管理员和用户管理员可访问此页面</div>
			<a href="/chat/" style="margin-top:16px;color:var(--primary)">返回首页</a>
		</div>
	</template>

	<template id="tmpl-dept-card">
		<div class="dept-card">
			<div class="flex items-center justify-between">
				<div class="dept-card-meta">
					<span class="dept-card-name">__NAME__</span>
					<span class="text-sub text-sm">__CODE__</span>
					<span class="tag tag-sm" style="background:var(--bg-sub)">__USER_COUNT__ 人</span>
					__LEADER_INFO__
				</div>
				<div class="dept-card-actions">
					<button class="btn btn-sm btn-outline" onclick="openDeptModal(__ID__)">编辑</button>
					<button class="btn btn-sm btn-outline" onclick="openTeamManageModal(__ID__)">管理团队</button>
					<button class="btn btn-sm btn-danger" onclick="deleteDept(__ID__,'__NAME_ESC__')">删除</button>
				</div>
			</div>
			__TEAMS_HTML__
		</div>
	</template>

	<template id="tmpl-user-search-result">
		<div class="dropdown-item" onmousedown="__ONCLICK__">
			<span style="font-weight:500">__NAME__</span>
			<span class="text-sub text-sm">__EMAIL__</span>
		</div>
	</template>

	<template id="tmpl-team-row">
		<div class="team-card" id="teamCard-__TEAM_ID__">
			<div class="team-card-info">
				<span class="team-card-name">__NAME__</span>
				<span class="team-card-leader">__LEADER__</span>
			</div>
			<div class="team-card-actions">
				<button class="btn btn-sm btn-outline" onclick="editTeam(__TEAM_ID__)">编辑</button>
				<button class="btn btn-sm btn-danger" onclick="deleteTeam(__TEAM_ID__,'__NAME_ESC__')">删除</button>
			</div>
		</div>
		<div id="teamForm-__TEAM_ID__" class="team-form hidden">
			<div class="team-form-editing">
				<div class="flex items-center justify-between mb-12">
					<div class="text-sm font-medium">编辑团队：<span id="teamFormTitle-__TEAM_ID__"></span></div>
					<button class="btn btn-sm btn-ghost" onclick="cancelTeamEdit()" style="font-size:18px">&times;</button>
				</div>
				<input type="hidden" class="team-form-id">
				<div class="form-item">
					<label class="form-label">团队名称 <span class="required">*</span></label>
					<input class="team-form-name input" placeholder="如: AI 平台组">
				</div>
				<div class="form-item">
					<label class="form-label">编码 <span class="form-hint">（留空自动生成，含部门前缀）</span></label>
					<input class="team-form-code input" placeholder="如: yfzx_aiptz">
				</div>
				<div class="form-item">
					<label class="form-label">描述</label>
					<input class="team-form-desc input" placeholder="团队描述">
				</div>
				<div class="form-item">
					<label class="form-label">团队组长</label>
					<div class="relative">
						<input class="team-form-leader-search input" placeholder="搜索团队内用户姓名..." autocomplete="off">
						<div class="team-form-leader-results dropdown-menu"></div>
					</div>
					<input type="hidden" class="team-form-leader-id">
					<div class="team-form-leader-selected text-sub text-sm mt-8"></div>
				</div>
				<div class="flex justify-end gap-8 mt-16">
					<button class="btn btn-sm btn-outline" onclick="cancelTeamEdit()">取消</button>
					<button class="btn btn-sm btn-primary" onclick="saveTeam(__TEAM_ID__)">保存</button>
				</div>
			</div>
		</div>
	</template>

	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/admin.js"></script>
	<script src="/static/js/admin-org.js"></script>
</body>

</html>
