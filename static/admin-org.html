<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>组织架构管理 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/admin-org.css">
</head>

<body>
	<div id="topnav-container"></div>
	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header">
				<div class="flex items-baseline gap-10">
					<div class="page-title">组织架构管理</div>
					<div class="page-subtitle">管理组织架构（部门/团队）</div>
				</div>
			</div>

			<!-- ===== 部门管理 ===== -->
			<div class="card flex flex-col overflow-hidden" style="flex:1;min-height:0">
				<div class="flex items-center justify-between mb-16 shrink-0">
					<div class="card-title mb-0">部门管理</div>
					<button class="btn btn-primary btn-sm" id="btnAddDept" onclick="openDeptModal()">＋ 新增部门</button>
				</div>
				<div id="deptList" class="card-scroll"></div>
			</div>
		</div>
	</div>

	<!-- ===== 部门 Modal ===== -->
	<div class="modal" id="deptModal" style="width:460px">
		<div class="modal-header">
			<div class="modal-title" id="deptModalTitle">新增部门</div>
			<button class="modal-close" onclick="closeModal('deptModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh">
			<input type="hidden" id="deptId">
			<div class="form-item">
				<label class="form-label">部门名称 <span class="required">*</span></label>
				<input id="deptName" class="input" placeholder="如: 研发部">
			</div>
			<div class="form-item">
				<label class="form-label">编码 <span class="form-hint">（留空自动生成拼音首字母）</span></label>
				<input id="deptCode" class="input" placeholder="如: yfb">
			</div>
			<div class="form-item">
				<label class="form-label">部门经理 <span class="form-hint">（通过"任命经理"发起审批工单）</span></label>
				<div class="text-sub text-sm" id="deptLeaderDisplay"></div>
			</div>
		</div>
		<div class="modal-footer">
			<button class="btn btn-sm btn-outline" onclick="closeModal('deptModal')">取消</button>
			<button class="btn btn-sm btn-primary" onclick="saveDept()">保存</button>
		</div>
	</div>

	<!-- ===== 团队管理 Modal ===== -->
	<div class="modal" id="teamManageModal" style="width:560px">
		<div class="modal-header">
			<div class="modal-title" id="teamManageModalTitle">管理团队</div>
			<button class="modal-close" onclick="closeModal('teamManageModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh">
			<div id="teamManageList"></div>
		</div>
		<div class="modal-footer" style="justify-content: space-between;">
			<button class="btn btn-primary btn-sm" id="btnAddTeam" onclick="openTeamForm()">＋ 新增团队</button>
			<button class="btn btn-sm btn-outline" onclick="closeModal('teamManageModal')">关闭</button>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<!-- ===== 任命管理岗 Modal（上级发起授予工单） ===== -->
	<div class="modal" id="nominateModal" style="width:460px">
		<div class="modal-header">
			<div class="modal-title" id="nominateModalTitle">任命组长</div>
			<button class="modal-close" onclick="closeModal('nominateModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh">
			<input type="hidden" id="nominateMode" value="nominate">
			<input type="hidden" id="nominateTargetType">
			<input type="hidden" id="nominateTargetId">
			<input type="hidden" id="nominateRoleKey">
			<div class="form-item">
				<label class="form-label">任命岗位</label>
				<div class="text-sub text-sm" id="nominateRoleDisplay"></div>
			</div>
			<!-- 协作角色授权模式(查看者/贡献者)才显示:角色与授权范围选择 -->
			<div class="form-item" id="grantRoleItem" style="display:none">
				<label class="form-label">授权角色</label>
				<select id="grantRoleSelect" class="select" onchange="loadGrantChainHint()">
					<option value="viewer">查看者</option>
					<option value="contributor">贡献者</option>
				</select>
			</div>
			<div class="form-item" id="grantScopeItem" style="display:none">
				<label class="form-label">授权范围</label>
				<select id="grantScopeSelect" class="select"></select>
			</div>
			<div class="form-item">
				<label class="form-label">被任命人 <span class="required">*</span></label>
				<div class="relative">
					<input id="nominateUserSearch" class="input" placeholder="搜索用户姓名..." autocomplete="off"
						oninput="searchNominateUser()" onfocus="searchNominateUser()">
					<div id="nominateUserResults" class="dropdown-menu"></div>
				</div>
				<input type="hidden" id="nominateUserId">
			</div>
			<div class="form-item">
				<label class="form-label">任命理由 <span class="required">*</span></label>
				<textarea id="nominateReason" class="input" rows="2" placeholder="如: 组织任命/团队管理需要"></textarea>
			</div>
			<div class="text-sub text-sm" id="nominateChainHint"></div>
		</div>
		<div class="modal-footer">
			<button class="btn btn-sm btn-outline" onclick="closeModal('nominateModal')">取消</button>
			<button class="btn btn-sm btn-primary" id="nominateSubmitBtn" onclick="submitNominate()">提交任命</button>
		</div>
	</div>

	<!-- ===== 模板 ===== -->
	<template id="tmpl-no-permission">
		<div class="flex items-center justify-center flex-col" style="height:100vh;color:var(--text-sub)">
			<div style="font-size:48px;margin-bottom:16px">&#128274;</div>
			<div style="font-size:16px">仅超级管理员和用户管理员可访问此页面</div>
			<a href="/chat/" style="margin-top:16px;color:var(--primary)">返回首页</a>
		</div>
	</template>

	<template id="tmpl-dept-card">
		<div class="dept-card">
			<div class="flex items-center justify-between">
				<div class="dept-card-meta">
					<span class="dept-card-name">__NAME__</span>
					<span class="text-sub text-sm">__CODE__</span>
					<span class="tag tag-sm" style="background:var(--bg-sub)">__USER_COUNT__ 人</span>
					__LEADER_INFO__
				</div>
				<div class="dept-card-actions">
					__ACTIONS__
				</div>
			</div>
			__TEAMS_HTML__
		</div>
	</template>

	<template id="tmpl-user-search-result">
		<div class="dropdown-item" onmousedown="__ONCLICK__">
			<span style="font-weight:500">__NAME__</span>
			<span class="text-sub text-sm">__EMAIL__</span>
		</div>
	</template>

	<template id="tmpl-team-row">
		<div class="team-card" id="teamCard-__TEAM_ID__">
			<div class="team-card-info">
				<span class="team-card-name">__NAME__</span>
				<span class="text-sub text-sm">__USER_COUNT__ 人</span>
				<span class="team-card-leader">__LEADER__</span>
			</div>
			<div class="team-card-actions">
				__ACTIONS__
			</div>
		</div>
	</template>

	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/admin.js"></script>
	<script src="/static/js/admin-org.js"></script>
</body>

</html>
