<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RBAC 权限配置 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/admin-rbac.css">
</head>

<body>
	<div id="topnav-container"></div>
	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header">
				<div class="flex items-baseline gap-10">
					<div class="page-title">RBAC 权限配置</div>
					<div class="page-subtitle">管理角色与权限分配</div>
				</div>
			</div>

			<div class="flex gap-16" style="flex:1;min-height:0">
				<!-- ===== 角色列表 ===== -->
				<div class="card flex flex-col overflow-hidden" style="width:360px;flex-shrink:0">
					<div class="flex items-center justify-between mb-16 shrink-0">
						<div class="card-title mb-0">角色列表</div>
						<button class="btn btn-primary btn-sm" onclick="openRoleModal()">＋ 新增角色</button>
					</div>
					<div id="roleList" class="card-scroll"></div>
				</div>

				<!-- ===== 权限分配 ===== -->
				<div class="card flex flex-col overflow-hidden" style="flex:1;min-width:0">
					<div class="flex items-center justify-between mb-16 shrink-0">
						<div class="card-title mb-0">
							权限分配
							<span id="currentRoleName" class="text-sub text-sm" style="font-weight:400;margin-left:8px"></span>
						</div>
						<button class="btn btn-primary btn-sm" id="btnSavePerms" onclick="saveRolePermissions()" disabled>保存权限</button>
					</div>
					<div id="permPanel" class="card-scroll">
						<div class="empty">
							<div class="empty-icon">👈</div>
							<div class="empty-text">请从左侧选择一个角色</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- ===== 角色 Modal ===== -->
	<div class="modal" id="roleModal" style="width:460px">
		<div class="modal-header">
			<div class="modal-title" id="roleModalTitle">新增角色</div>
			<button class="modal-close" onclick="closeModal('roleModal')">&times;</button>
		</div>
		<div class="modal-body">
			<input type="hidden" id="roleId">
			<div class="form-item">
				<label class="form-label">角色名称 <span class="required">*</span></label>
				<input id="roleName" class="input" placeholder="如: 审计员">
			</div>
			<div class="form-item">
				<label class="form-label">角色编码 <span class="required">*</span></label>
				<input id="roleCode" class="input" placeholder="如: auditor（英文小写+下划线）">
			</div>
			<div class="form-item">
				<label class="form-label">描述</label>
				<input id="roleDesc" class="input" placeholder="角色职责描述">
			</div>
		</div>
		<div class="modal-footer">
			<button class="btn btn-sm btn-outline" onclick="closeModal('roleModal')">取消</button>
			<button class="btn btn-sm btn-primary" id="btnSaveRole" onclick="saveRole()">保存</button>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<!-- ===== 模板 ===== -->
	<template id="tmpl-no-permission">
		<div class="flex items-center justify-center flex-col" style="height:100vh;color:var(--text-sub)">
			<div style="font-size:48px;margin-bottom:16px">&#128274;</div>
			<div style="font-size:16px">仅超级管理员可访问此页面</div>
			<a href="/chat/" style="margin-top:16px;color:var(--primary)">返回首页</a>
		</div>
	</template>

	<template id="tmpl-role-card">
		<div class="role-card" id="roleCard-__ID__" onclick="selectRole(__ID__)">
			<div class="role-card-header">
				<div class="role-card-info">
					<span class="role-card-name">__NAME__</span>
					<span class="role-card-code">__CODE__</span>
				</div>
				__BUILTIN__
			</div>
			<div class="role-card-desc">__DESC__</div>
			<div class="role-card-actions">
				<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openRoleModal(__ID__)">编辑</button>
				<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteRole(__ID__,'__NAME_ESC__')">删除</button>
			</div>
		</div>
	</template>

	<template id="tmpl-perm-group">
		<div class="perm-group">
			<div class="perm-group-title">__module_label__</div>
			<div class="perm-group-items">__perms_html__</div>
		</div>
	</template>

	<template id="tmpl-perm-item">
		<label class="perm-item">
			<input type="checkbox" value="__perm_id__" __checked__>
			<div class="perm-item-info">
				<div class="perm-item-name">__perm_name__</div>
				<div class="perm-item-code">__perm_code__</div>
			</div>
		</label>
	</template>

	<script src="/static/js/common.js"></script>
	<script src="/static/js/admin.js"></script>
	<script src="/static/js/admin-rbac.js"></script>
</body>

</html>
