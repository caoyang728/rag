<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>系统配置 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/admin-system-config.css">
</head>

<body>
	<div id="topnav-container"></div>
	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header page-header-row">
			<div class="flex items-baseline gap-10">
				<div class="page-title">系统配置</div>
				<div class="page-subtitle">运行期参数管理（修改需提交工单，审批通过后生效）</div>
			</div>
			<!-- 顶部操作入口：工单列表 + 模型管理 -->
			<div class="page-header-actions">
				<button class="btn btn-sm btn-outline" onclick="openTicketModal()">📋 工单列表</button>
				<button class="btn btn-sm btn-primary" onclick="openModelModal()">🧠 模型管理</button>
			</div>
		</div>

			<div class="flex gap-16" style="flex:1;min-height:0">
				<!-- ===== 分类导航 ===== -->
				<div class="card flex flex-col overflow-hidden" style="width:200px;flex-shrink:0">
					<div class="card-title mb-16 shrink-0">配置分类</div>
					<div id="categoryNav" class="card-scroll config-nav"></div>
				</div>

				<!-- ===== 配置项列表 ===== -->
				<div class="card flex flex-col overflow-hidden" style="flex:1;min-width:0">
					<div class="flex items-center justify-between mb-16 shrink-0">
						<div class="card-title mb-0">
							<span id="currentCategoryName">配置项</span>
							<span id="configCount" class="text-sub text-sm" style="font-weight:400;margin-left:8px"></span>
						</div>
						<button class="btn btn-sm btn-outline" onclick="openHistoryModal()">📜 变更记录</button>
					</div>
					<div id="configList" class="card-scroll">
						<div class="empty">
							<div class="empty-icon">⏳</div>
							<div class="empty-text">加载中...</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<!-- ===== 模型管理弹窗 =====  -->
	<div class="modal" id="modelManageModal" style="width:880px;max-width:95vw">
		<div class="modal-header">
			<div class="modal-title">模型管理</div>
			<button class="modal-close" onclick="closeModelModal()">&times;</button>
		</div>
		<div class="modal-body" style="padding:16px 20px">
			<!-- 类型切换 tab -->
			<div class="model-tabs" id="modelTabs">
				<button class="model-tab active" data-type="llm" onclick="switchModelTab('llm')">🤖 LLM 对话</button>
				<button class="model-tab" data-type="embedding" onclick="switchModelTab('embedding')">🧮 Embedding</button>
				<button class="model-tab" data-type="rerank" onclick="switchModelTab('rerank')">🎯 Rerank</button>
			</div>

			<!-- 模型列表表格 -->
		<div class="model-table-wrap">
			<table class="model-table" id="modelTable">
				<thead>
					<tr>
						<th style="width:20%">名称</th>
						<th style="width:12%">提供商</th>
						<th style="width:22%">API 地址</th>
						<th style="width:20%">模型标识</th>
						<th style="width:8%">超时</th>
						<th style="width:8%">状态</th>
						<th style="width:10%">操作</th>
					</tr>
				</thead>
				<tbody id="modelTableBody">
					<tr><td colspan="7" class="model-empty">加载中...</td></tr>
				</tbody>
			</table>
		</div>

			<!-- 提示：API Key 不在此管理 -->
			<div class="model-tip">提示：API Key 仍保留在 .env 中，此处仅管理模型调用所需的地址与标识。</div>
		</div>
		<div class="modal-footer" style="justify-content:space-between">
			<button class="btn btn-sm btn-primary" onclick="showModelForm(null)">＋ 新增模型</button>
			<button class="btn btn-sm btn-outline" onclick="closeModelModal()">关闭</button>
		</div>
	</div>

	<!-- ===== 配置变更工单列表弹窗 =====
	     展示工单流转情况：配置项、原值→新值、风险等级、状态、创建人、创建时间。
	     支持按状态筛选（待审核/我的工单/已通过/已驳回/已撤回），点击工单展开详情 + 审批操作。 -->
	<div class="modal" id="ticketListModal" style="width:960px;max-width:95vw">
		<div class="modal-header">
			<div class="modal-title">变更工单</div>
			<button class="modal-close" onclick="closeTicketModal()">&times;</button>
		</div>
		<div class="modal-body" style="padding:12px 20px;overflow:hidden;display:flex;flex-direction:column">
			<!-- 工单类型切换 -->
			<div class="ticket-tabs" style="margin-bottom:8px">
				<button class="ticket-tab active" data-type="config" onclick="switchTicketType('config')">配置工单</button>
				<button class="ticket-tab" data-type="model" onclick="switchTicketType('model')">模型工单</button>
			</div>
			<!-- 状态筛选 tab -->
			<div class="ticket-tabs" id="ticketTabs">
				<button class="ticket-tab active" data-status="pending,first_approved" onclick="switchTicketTab('pending,first_approved')">待审核</button>
				<button class="ticket-tab" data-status="mine" onclick="switchTicketTab('mine')">我的工单</button>
				<button class="ticket-tab" data-status="approved" onclick="switchTicketTab('approved')">已通过</button>
				<button class="ticket-tab" data-status="rejected" onclick="switchTicketTab('rejected')">已驳回</button>
				<button class="ticket-tab" data-status="withdrawn" onclick="switchTicketTab('withdrawn')">已撤回</button>
			</div>
			<div id="ticketListBody" class="ticket-list-body">
				<div class="ticket-empty">加载中...</div>
			</div>
		</div>
		<div class="modal-footer">
			<div id="ticketPagination" class="ticket-pagination"></div>
		</div>
	</div>

	<!-- ===== 配置变更记录弹窗 =====
	     展示所有已生效的配置变更历史（从已通过工单汇总），
	     包含配置项、变更前后的值、操作人、生效时间。 -->
	<div class="modal" id="historyModal" style="width:900px;max-width:95vw">
		<div class="modal-header">
			<div class="modal-title">配置变更记录</div>
			<button class="modal-close" onclick="closeHistoryModal()">&times;</button>
		</div>
		<div class="modal-body" style="padding:16px 20px">
			<div class="history-search-bar">
				<input type="text" class="input" id="historySearchInput" placeholder="搜索申请人或配置项（中文名/字段名）" oninput="filterHistoryRecords()">
			</div>
			<div id="historyListBody" class="history-list-body">
				<div class="ticket-empty">加载中...</div>
			</div>
		</div>
		<div class="modal-footer">
			<div id="historyPagination" class="ticket-pagination"></div>
		</div>
	</div>

	<!-- ===== 无权限模板 ===== -->
	<template id="tmpl-no-permission">
		<div class="flex items-center justify-center flex-col" style="height:100vh;color:var(--text-sub)">
			<div style="font-size:48px;margin-bottom:16px">&#128274;</div>
			<div style="font-size:16px">仅超级管理员或维护管理员可访问此页面</div>
			<a href="/chat/" style="margin-top:16px;color:var(--primary)">返回首页</a>
		</div>
	</template>

	<!-- ===== 分类导航项模板 ===== -->
	<template id="tmpl-category-item">
		<div class="config-nav-item __ACTIVE__" onclick="selectCategory('__KEY__')">
			<span class="config-nav-icon">__ICON__</span>
			<span class="config-nav-label">__LABEL__</span>
			<span class="config-nav-count">__COUNT__</span>
		</div>
	</template>

	<!-- ===== 配置项行模板 ===== -->
	<template id="tmpl-config-item">
		<div class="config-item __READONLY_CLASS__" data-key="__KEY_ESC__" id="cfg-row-__KEY_ATTR__">
			<!-- 第一行：中文名(200px) + 控件 + 操作按钮 -->
			<div class="config-item-row">
				<div class="config-item-label">__LABEL__
					__BADGE_READONLY__
					__BADGE_SECRET__
					__BADGE_RISK__
				</div>
				<div class="config-item-control" id="cfg-control-__KEY_ATTR__">__CONTROL__</div>
				<div class="config-item-actions">
					<!-- 重置按钮：默认隐藏，仅在修改值后显示 -->
					<button class="btn btn-sm btn-outline btn-reset hidden" data-key="__KEY_ATTR__" onclick="resetConfig(this.dataset.key)" title="恢复当前值">↺</button>
					<button class="btn btn-sm btn-primary btn-save" data-key="__KEY_ATTR__" onclick="submitTicket(this.dataset.key)" disabled>提交工单</button>
				</div>
			</div>
			<!-- 第二行：字段名(200px) + 解释（与控件对齐） + 上次修改时间 -->
			<div class="config-item-row config-item-meta">
				<div class="config-item-meta-left">
					<span class="config-item-key-text">__KEY_ESC__</span>
				</div>
				<span class="config-item-hint">__DESC__</span>
				<span class="config-item-updated" id="cfg-updated-__KEY_ATTR__"></span>
			</div>
		</div>
	</template>

	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/admin-system-config.js"></script>
</body>

</html>
