<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>用户与角色 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/multi-select.css">
	<link rel="stylesheet" href="/static/css/admin-users.css">
</head>

<body>
	<div id="topnav-container"></div>
	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header">
				<div class="flex items-baseline gap-10">
					<div class="page-title">用户与角色</div>
					<div class="page-subtitle">检索、新增、编辑、禁用及导出用户</div>
				</div>
			</div>

			<div class="card flex flex-col overflow-hidden flex-1 min-h-0">
				<!-- 工具栏 -->
				<div class="flex items-center justify-between mb-8 shrink-0 flex-wrap gap-8">
					<div class="flex gap-8 items-center flex-wrap">
						<form class="hidden">
							<input type="text" autocomplete="username" readonly>
							<input type="password" autocomplete="current-password" readonly>
						</form>
						<input id="searchInput" name="search_query_noname" class="input" placeholder="搜索用户"
							style="width:180px" autocomplete="off" autocapitalize="off" autocorrect="off"
							spellcheck="false" oninput="onSearchInput()">
						<select id="filterDept" class="select" style="width:130px" onchange="onFilterDeptChange()">
							<option value="">全部部门</option>
						</select>
						<select id="filterTeam" class="select" style="width:130px" onchange="searchUsers()" disabled>
							<option value="">全部团队</option>
						</select>
						<select id="filterStatus" class="select" style="width:110px" onchange="searchUsers()">
							<option value="">全部状态</option>
							<option value="active">启用</option>
							<option value="disabled">禁用</option>
						</select>
						<button class="btn btn-primary btn-sm" onclick="searchUsers()">搜索</button>
					</div>
					<div class="flex gap-8">
						<button class="btn btn-sm" onclick="downloadImportTemplate()" style="background:var(--bg)">下载模板</button>
						<button class="btn btn-sm" onclick="batchImport()" style="background:var(--bg)">批量导入</button>
						<button class="btn btn-sm" onclick="batchExport()" style="background:var(--bg)">批量导出</button>
						<button class="btn btn-sm" onclick="exportAll()" style="background:var(--bg)">导出全部</button>
						<button class="btn btn-primary btn-sm" onclick="openUserModal()">＋ 新建用户</button>
						<input type="file" id="importFileInput" accept=".csv" style="display:none" onchange="handleImportFile(event)">
					</div>
				</div>

				<!-- 用户表格 -->
				<div class="card-scroll">
					<table class="table">
						<thead>
							<tr>
								<th style="width:40px"><input type="checkbox" id="checkAll" onchange="toggleCheckAll()">
								</th>
								<th class="th-sortable" onclick="onSortChange('username')">用户名 <span id="sort-username" class="sort-indicator"></span></th>
								<th class="th-sortable" onclick="onSortChange('real_name')">姓名 <span id="sort-real_name" class="sort-indicator"></span></th>
								<th class="th-sortable" onclick="onSortChange('email')">邮箱 <span id="sort-email" class="sort-indicator"></span></th>
								<th>部门</th>
								<th>团队</th>
								<th>最后登录</th>
								<th>状态</th>
								<th style="width:240px">操作</th>
							</tr>
						</thead>
						<tbody id="userTable">
							<tr>
								<td colspan="9" class="text-sub text-sm text-center" style="padding:30px">加载中...</td>
							</tr>
						</tbody>
					</table>
				</div>

				<!-- 分页 -->
				<div class="flex items-center justify-center mt-16 shrink-0 gap-10">
					<span class="text-sub text-sm" id="paginationInfo"></span>
					<select id="pageSizeSelect" class="select page-size-select" onchange="onPageSizeChange()">
						<option value="20">20 条</option>
						<option value="50">50 条</option>
						<option value="100">100 条</option>
					</select>
					<div class="flex items-center gap-4" id="paginationBtns"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- ===== 用户 Modal ===== -->
	<div class="modal" id="userModal" style="width:600px;max-width:90vw">
		<div class="modal-header">
			<div class="modal-title" id="userModalTitle">新建用户</div>
			<button class="modal-close" onclick="closeModal('userModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh">
			<input type="hidden" id="editUserId">

			<!-- ===== 基本信息 ===== -->
			<div class="form-section-title">基本信息</div>
			<div class="form-row">
				<div class="form-item flex-1">
					<label class="form-label">用户名 <span class="required">*</span></label>
					<input id="userUsername" class="input" disabled>
				</div>
				<div class="form-item flex-1">
					<label class="form-label">姓名 <span class="required">*</span></label>
					<input id="userRealName" class="input">
				</div>
			</div>
			<div class="form-row">
				<div class="form-item flex-1">
					<label class="form-label">邮箱</label>
					<input id="userEmail" class="input" type="email">
				</div>
				<div class="form-item flex-1">
					<label class="form-label">状态</label>
					<select id="userStatus" class="select">
						<option value="active">启用</option>
						<option value="disabled">禁用</option>
					</select>
				</div>
			</div>
			<!-- ===== 组织架构 ===== -->
			<div class="form-section-title">组织架构</div>
			<div class="form-row">
				<div class="form-item flex-1">
					<label class="form-label">部门</label>
					<select id="userDept" class="select" onchange="onDeptChange()">
						<option value="">— 无 —</option>
					</select>
				</div>
				<div class="form-item flex-1">
					<label class="form-label">团队</label>
					<select id="userDeptTeam" class="select">
						<option value="">请先选择部门</option>
					</select>
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<button class="btn-delete hidden mr-auto" id="modalDeleteBtn" onclick="deleteUserFromModal()">删除用户</button>
			<div class="flex gap-8">
				<button class="btn-cancel" onclick="closeModal('userModal')">取消</button>
				<button class="btn-save" onclick="saveUser()">保存</button>
			</div>
		</div>
	</div>

	<!-- ===== Templates ===== -->
	<template id="tmpl-user-row">
		<tr>
			<td><input type="checkbox" class="user-check" value="{{id}}"></td>
			<td><strong>{{username}}</strong></td>
			<td>{{real_name}}</td>
			<td>{{email}}</td>
			<td>{{dept_name}}</td>
			<td>{{team_name}}</td>
			<td><span class="text-sm text-sub">{{last_login}}</span></td>
			<td>{{status_tag}}</td>
			<td>
				<div class="flex gap-4" data-user-id="{{id}}">
					<button class="btn btn-sm btn-outline user-action-perm">权限</button>
					<button class="btn btn-sm btn-outline user-action-edit">编辑</button>
					<button class="btn btn-sm btn-outline user-action-toggle">{{toggle_label}}</button>
				</div>
			</td>
		</tr>
	</template>

	<!-- 通用确认弹窗：填充内容后 showModal('confirmModal') 打开，确认按钮回调 confirmCallback -->
	<div id="confirmModal" class="modal modal-sm">
		<div class="modal-header">
			<div class="modal-title" id="confirmTitle">确认操作</div>
			<button class="modal-close" onclick="closeConfirmModal(false)">×</button>
		</div>
		<div class="modal-body">
			<div id="confirmMessage" style="padding:12px 0;font-size:14px;line-height:1.6"></div>
		</div>
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeConfirmModal(false)" id="confirmCancelBtn">取消</button>
			<button class="btn-delete" onclick="closeConfirmModal(true)" id="confirmOkBtn">确认</button>
		</div>
	</div>

	<!-- 用户权限详情弹窗 -->
	<div id="permModal" class="modal" style="width:720px;max-width:90vw">
		<div class="modal-header">
			<div class="modal-title" id="permModalTitle">用户权限详情</div>
			<button class="modal-close" onclick="closeModal('permModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh" id="permModalBody">
			<div class="text-sub text-center" style="padding:30px">加载中...</div>
		</div>
		<div class="modal-footer">
			<button class="btn btn-outline" onclick="closeModal('permModal')">关闭</button>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>
	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/multi-select.js"></script>
	<script src="/static/js/admin-users.js"></script>
</body>

</html>
