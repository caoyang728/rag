<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户与角色 · 知库 Agent</title>
  <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
  <div id="topnav-container"></div>
  <div class="layout">
    <div id="sidebar-container"></div>
    <div class="main">
      <div class="page-header">
        <div class="breadcrumb"><a href="/chat/">首页</a><span class="sep">/</span>管理后台<span class="sep">/</span>用户与角色</div>
        <div>
          <div class="page-title">用户与角色</div>
          <div class="page-subtitle">检索、新增、编辑、禁用及导出用户</div>
        </div>
      </div>

      <div class="card">
        <!-- 工具栏 -->
        <div class="flex items-center justify-between mb-16" style="flex-wrap:wrap;gap:8px">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <div style="display:none">
  <input type="text" autocomplete="username" readonly>
  <input type="password" autocomplete="current-password" readonly>
</div>
<input id="searchInput" name="search_query_noname" class="input" placeholder="搜索用户" style="width:180px" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')searchUsers()">
            <select id="filterDept" class="select" style="width:130px" onchange="searchUsers()"><option value="">全部部门</option></select>
            <select id="filterRole" class="select" style="width:110px" onchange="searchUsers()"><option value="">全部角色</option></select>
            <select id="filterStatus" class="select" style="width:110px" onchange="searchUsers()">
              <option value="">全部状态</option>
              <option value="active">启用</option>
              <option value="disabled">禁用</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="searchUsers()">搜索</button>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm" onclick="batchExport()" style="background:var(--bg-sub)">批量导出</button>
            <button class="btn btn-sm" onclick="exportAll()" style="background:var(--bg-sub)">导出全部</button>
            <button class="btn btn-primary btn-sm" onclick="openUserModal()">＋ 新建用户</button>
          </div>
        </div>

        <!-- 用户表格 -->
        <table class="table">
          <thead><tr>
            <th style="width:40px"><input type="checkbox" id="checkAll" onchange="toggleCheckAll()"></th>
            <th>用户名</th><th>姓名</th><th>邮箱</th><th>部门</th><th>角色</th><th>状态</th><th style="width:180px">操作</th>
          </tr></thead>
          <tbody id="userTable"><tr><td colspan="8" class="text-sub text-sm" style="text-align:center;padding:30px">加载中...</td></tr></tbody>
        </table>

        <!-- 分页 -->
        <div class="flex items-center justify-between mt-16">
          <div class="text-sub text-sm" id="paginationInfo"></div>
          <div style="display:flex;gap:4px" id="paginationBtns"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 用户 Modal ===== -->
  <div class="modal" id="userModal" style="max-width:640px">
      <div class="modal-header">
        <div class="modal-title" id="userModalTitle">新建用户</div>
        <button class="modal-close" onclick="closeModal('userModal')">&times;</button>
      </div>
      <div class="modal-body" style="max-height:70vh;overflow-y:auto">
        <input type="hidden" id="editUserId">

        <!-- ===== 基本信息 ===== -->
        <div class="form-section-title">基本信息</div>
        <div class="form-row">
          <div class="form-item" style="flex:1">
            <label class="form-label">用户名 <span class="required">*</span></label>
            <input id="userUsername" class="input">
          </div>
          <div class="form-item" style="flex:1">
            <label class="form-label">姓名 <span class="required">*</span></label>
            <input id="userRealName" class="input">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item" style="flex:1">
            <label class="form-label">邮箱</label>
            <input id="userEmail" class="input" type="email">
          </div>
          <div class="form-item" style="flex:1">
            <label class="form-label" id="pwdLabel">密码 <span class="required">*</span></label>
            <input id="userPassword" class="input" type="password" placeholder="至少 8 位">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item" style="flex:1">
            <label class="form-label">部门</label>
            <select id="userDept" class="select" onchange="onDeptChange()"><option value="">— 无 —</option></select>
          </div>
          <div class="form-item" style="flex:1">
            <label class="form-label">状态</label>
            <select id="userStatus" class="select">
              <option value="active">启用</option>
              <option value="disabled">禁用</option>
            </select>
          </div>
        </div>

        <!-- ===== 角色 ===== -->
        <div class="form-section-title">角色</div>
        <div id="userRolesCheckbox" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px"></div>
        <div id="rolePermSummary" class="text-sub" style="font-size:12px;padding:4px 0"></div>

        <!-- ===== 所属团队 ===== -->
        <div class="form-section-title">所属团队</div>
        <div id="userTeamsCheckbox" style="display:flex;flex-wrap:wrap;gap:8px"></div>
        <div id="teamEmpty" class="text-sub text-sm" style="display:none;padding:4px 0">暂无团队（请在 RBAC 页面创建）</div>

        <!-- ===== 文档操作权限 (本部门/团队) ===== -->
        <div class="form-section-title">文档操作权限 <span class="text-sub text-sm" style="font-weight:400">— 对本部门/团队文档的操作权限</span></div>
        <div id="scopePermContainer" style="border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--white)">
          <div id="scopePermList"><span class="text-sub text-sm">请先在上方选择部门或团队，然后定义操作权限</span></div>
        </div>

        <!-- ===== 跨域访问授权 ===== -->
        <div class="form-section-title">跨域访问授权 <span class="text-sub text-sm" style="font-weight:400">— 授予访问其他部门/团队文档的权限</span></div>
        <div id="crossScopeSection" style="border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--white)">
          <div id="crossScopeList" style="margin-bottom:10px"></div>
          <div style="position:relative">
            <input id="crossScopeSearch" class="input" placeholder="搜索部门或团队名称..." 
                   oninput="searchCrossScope()" onfocus="searchCrossScope()" autocomplete="off"
                   style="padding-right:30px">
            <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-sub);pointer-events:none;font-size:13px">&#128269;</span>
            <div id="crossScopeResults" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:10;
                 background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
                 max-height:220px;overflow-y:auto;box-shadow:var(--shadow-lg);margin-top:2px"></div>
          </div>
          <div id="crossScopeActions" style="display:none;margin-top:10px;padding:10px;background:var(--bg-main);border-radius:6px">
            <div style="font-size:13px;font-weight:500;margin-bottom:6px">选择操作权限：<span id="crossScopeSelectedLabel" style="color:var(--primary)"></span></div>
            <div id="crossScopeActionBoxes" style="display:flex;gap:16px;flex-wrap:wrap"></div>
            <div style="display:flex;gap:8px;margin-top:8px">
              <input type="hidden" id="crossScopePendingType">
              <input type="hidden" id="crossScopePendingId">
              <input type="hidden" id="crossScopePendingName">
              <button class="btn btn-primary btn-sm" onclick="addCrossScope()">确认添加</button>
              <button class="btn btn-sm" onclick="$id('crossScopeActions').style.display='none';$id('crossScopeSearch').value=''">取消</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('userModal')">取消</button>
        <button class="btn btn-primary" onclick="saveUser()">保存</button>
      </div>
  </div>

  <div id="mask" class="mask"></div>
  <div id="toast-wrap" class="toast-wrap"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/admin-users.js"></script>
</body>
</html>
