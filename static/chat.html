<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>智能聊天 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/chat.css">
	<link rel="stylesheet" href="/static/css/preview-doc.css">
</head>

<body>
	<div id="topnav-container"></div>

	<!-- 知识来源下拉面板（固定定位，在导航栏下方）
	     顶层为 4 类数据来源开关（内部文档/数据库/联网/LLM，仅渲染系统配置开启的来源）；
	     勾选「内部文档」时才展示知识库节点树（仅显示当前用户有权限的节点） -->
	<div class="scope-dropdown" id="scopeDropdown">
		<div class="scope-hint">💡 选择数据来源与知识范围，可更精准地查询</div>
		<!-- 来源开关由 chat.js 按 /api/v1/chat/config/ 返回的 sources_enabled 动态渲染 -->
		<div class="source-switches" id="sourceSwitches"></div>
		<!-- 内部文档节点树（勾选「内部文档」时展示，数据来自 permission_only 接口） -->
		<div class="doc-scope-wrap" id="docScopeWrap">
			<div class="scope-hint doc-scope-title">📚 知识范围（内部文档）</div>
			<div class="scope-quick-actions">
				<button class="btn btn-sm" onclick="selectAllScopes()">全选</button>
				<button class="btn btn-sm" onclick="clearAllScopes()">清空</button>
			</div>
			<div class="scope-list" id="scopeList"></div>
		</div>
	</div>

	<div class="layout">
		<div id="sidebar-container"></div>

		<div class="chat-main">
			<div class="chat-header">
				<div class="chat-title-input hidden" id="chatTitle"></div>
				<div class="flex gap-8 items-center">
					<!-- 问答模式切换：auto=LLM自主决定是否调用工具（默认）/ rag=传统RAG / agent=强制Agent -->
					<div class="mode-switcher" id="modeSwitcher" role="tablist" aria-label="问答模式">
						<button class="mode-btn active" data-mode="auto" onclick="setChatMode('auto')" title="LLM 自主决定是否调用工具（推荐）">⚡ Auto</button>
						<button class="mode-btn" data-mode="rag" onclick="setChatMode('rag')" title="传统 RAG：预检索 + LLM 生成">📚 RAG</button>
						<button class="mode-btn" data-mode="agent" onclick="setChatMode('agent')" title="强制 Agent 模式：必定走 ReAct 工具循环">🤖 Agent</button>
					</div>
					<span class="tag tag-info">💡 4 层记忆</span>
					<button class="btn btn-sm" onclick="newSession()">+ 新建会话</button>
				</div>
			</div>

			<div class="chat-messages" id="chatMessages"></div>

			<div class="chat-input-area">
				<div class="chat-input-wrap">
					<textarea class="chat-input" id="chatInput" placeholder="请输入你的问题，Shift + Enter 换行，Enter 发送…"
						onkeydown="handleChatKey(event)"></textarea>
					<div class="chat-input-actions">
						<button class="chat-send-btn" id="chatSendBtn" onclick="sendChat()">发送 ↵</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 历史会话右栏 -->
		<aside class="chat-sessions">
			<div class="panel-header">
				<div class="panel-title">💬 历史会话</div>
				<div class="session-search-wrap">
					<input class="session-search-input" placeholder="搜索会话" id="sessionSearchInput"
						onkeydown="if(event.key==='Enter')searchSessions()" oninput="debounceSearch()">
					<button class="session-search-btn" onclick="searchSessions()" title="搜索">🔍</button>
				</div>
			</div>
			<div class="panel-body" id="sessionList"></div>
		</aside>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/preview-doc.js"></script>
	<script src="/static/js/chat.js"></script>

	<!-- ===== Template Fragments ===== -->
	<!-- 1. 空状态页 -->
	<template id="tmpl-chat-empty">
		<div class="msg-wrap">
			<div class="empty-state">
				<div style="text-align:center;padding:60px 20px">
					<div style="font-size:48px;margin-bottom:16px">💬</div>
					<div style="font-size:18px;font-weight:600;margin-bottom:8px">欢迎使用智能聊天</div>
					<div style="color:var(--text-sub);font-size:14px">选择知识来源，开始提问吧</div>
				</div>
			</div>
		</div>
	</template>

	<!-- 2. 知识库范围选择器节点 -->
	<template id="tmpl-scope-node">
		<label class="scope-item">
			<input type="checkbox">
			<span class="scope-label"></span>
		</label>
	</template>

	<!-- 3. AI 思考中占位 -->
	<template id="tmpl-ai-thinking">
		<div class="msg-ai-avatar">AI</div>
		<div class="msg-ai-content">
			<div class="flex items-center gap-8 text-sub">
				<div class="spinner"></div>正在检索知识库并思考中...
			</div>
		</div>
	</template>

	<!-- 4. 溯源来源卡片容器 -->
	<template id="tmpl-source-block">
		<div class="source-block">
			<div class="source-header"></div>
			<div class="source-list"></div>
		</div>
	</template>

	<!-- 4b. 单条溯源来源卡片（文档/数据库/网络共用骨架，类型徽标 + 标题 + 元信息） -->
	<template id="tmpl-source-card">
		<div class="source-card">
			<div class="source-card-head">
				<span class="source-card-badge"></span>
				<div class="source-card-title"></div>
			</div>
			<div class="source-card-meta"></div>
		</div>
	</template>

	<!-- 4d. 来源标签行（仅标签，无详细溯源卡片；如"🤖 大模型知识 · 仅供参考"） -->
	<template id="tmpl-source-tags-only">
		<div class="source-block">
			<div class="answer-source-tags"></div>
		</div>
	</template>

	<!-- 5. AI 回答完整内容区 -->
	<template id="tmpl-ai-answer">
		<div class="ai-thinking-area" id="thinkingArea"></div>
		<div class="ai-answer-text"></div>
		<div class="ai-source-area"></div>
		<div class="feedback-bar">
			<button class="feedback-btn feedback-good">👍 满意</button>
			<button class="feedback-btn feedback-bad">👎 不满意</button>
			<button class="feedback-btn feedback-detail-btn">💬 详细反馈</button>
			<span style="flex:1"></span>
			<span class="feedback-latency" style="font-size:11px;color:var(--text-sub)"></span>
		</div>
		<div class="feedback-detail"></div>
	</template>

	<!-- 5b. 思考过程区（Agent 模式可折叠，含工具调用链） -->
	<template id="tmpl-thinking-area">
		<div class="thinking-area">
			<div class="thinking-header" onclick="toggleThinkingArea(this)">
				<span class="thinking-icon">🤔</span>
				<span class="thinking-title">思考过程</span>
				<span class="thinking-summary"></span>
				<span class="thinking-toggle">▾</span>
			</div>
			<div class="thinking-body"></div>
		</div>
	</template>

	<!-- 5c. 单次工具调用卡片（tool_call → tool_result 配对） -->
	<template id="tmpl-tool-call">
		<div class="tool-call" data-call-id="">
			<div class="tool-call-header">
				<span class="tool-call-icon">🔧</span>
				<span class="tool-call-name"></span>
				<span class="tool-call-status">执行中...</span>
				<span class="tool-call-latency"></span>
			</div>
			<div class="tool-call-args"></div>
			<div class="tool-call-result"></div>
		</div>
	</template>

	<!-- 6. 用户消息气泡 -->
	<template id="tmpl-user-msg">
		<div class="msg msg-user">
			<div class="msg-user-content">
				<div class="msg-user-bubble"></div>
			</div>
			<div class="msg-user-side">
				<div class="msg-user-avatar"></div>
				<div class="msg-time"></div>
			</div>
		</div>
	</template>

	<!-- 8. AI 消息完整元素 -->
	<template id="tmpl-ai-msg">
		<div class="msg msg-ai">
			<div class="msg-ai-avatar">AI</div>
			<div class="msg-ai-content">
				<div class="ai-thinking-area"></div>
				<div class="ai-answer-text"></div>
				<div class="ai-source-area"></div>
				<div class="feedback-bar">
					<button class="feedback-btn feedback-good">👍 满意</button>
					<button class="feedback-btn feedback-bad">👎 不满意</button>
					<button class="feedback-btn feedback-detail-btn">💬 详细反馈</button>
					<span style="flex:1"></span>
					<span class="feedback-latency" style="font-size:11px;color:var(--text-sub)"></span>
				</div>
				<div class="feedback-detail"></div>
			</div>
		</div>
	</template>

	<!-- 9. 详细反馈表单 -->
	<template id="tmpl-feedback-form">
		<textarea placeholder="请描述具体的问题或建议..."></textarea>
		<div style="text-align:right;margin-top:6px">
			<button class="btn btn-sm feedback-cancel-btn">取消</button>
			<button class="btn btn-sm btn-primary feedback-submit-btn">提交反馈</button>
		</div>
	</template>

	<!-- 10. 会话分组 -->
	<template id="tmpl-session-group">
		<div class="session-group-title"></div>
		<div class="session-items-wrap"></div>
	</template>

	<!-- 10b. 单条会话项 -->
	<template id="tmpl-session-item">
		<div class="session-item">
			<div class="session-content">
				<div class="session-title" title="点击编辑标题"></div>
				<div class="session-preview"></div>
				<div class="session-time"></div>
			</div>
			<div class="session-actions">
				<button class="session-icon-btn icon-edit" title="编辑标题">
					<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
						<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
						<path d="m15 5 4 4"/>
					</svg>
				</button>
				<button class="session-icon-btn icon-del" title="删除会话">
					<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
						<path d="M3 6h18"/>
						<path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
						<path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
					</svg>
				</button>
			</div>
		</div>
	</template>

	<!-- 11. 消息列表包裹 -->
	<template id="tmpl-message-item">
		<div class="msg-wrap"></div>
	</template>

	<!-- 12. 错误消息 -->
	<template id="tmpl-error-message">
		<div class="error-text" style="color:var(--danger)"></div>
		<div class="error-hint" style="font-size:12px;color:var(--text-sub);margin-top:8px;margin-bottom:12px"></div>
	</template>

	<!-- 13. 工作流轨迹区（多 Agent 工作流节点可视化，含 HITL 审批） -->
	<template id="tmpl-workflow-area">
		<div class="workflow-area" data-workflow-id="">
			<div class="workflow-header">
				<span class="workflow-icon">🔄</span>
				<span class="workflow-title">多 Agent 工作流</span>
				<span class="workflow-status"></span>
			</div>
			<div class="workflow-body"></div>
		</div>
	</template>

	<!-- 13b. 单节点卡片（workflow_node_start / workflow_node_done 更新状态） -->
	<template id="tmpl-workflow-node">
		<div class="wf-node" data-node-id="" data-step-type="">
			<div class="wf-node-header">
				<span class="wf-node-icon"></span>
				<span class="wf-node-name"></span>
				<span class="wf-node-status">待执行</span>
				<span class="wf-node-latency"></span>
			</div>
			<div class="wf-node-detail"></div>
		</div>
	</template>

	<!-- 13c. 审批确认卡片（HITL：确认前工作流暂停）
	     approval_type=ticket  → 工单审批：显示"前往审批"链接 + "刷新结果"按钮
	     approval_type=inline  → 内嵌确认：显示"确认执行" + "拒绝"按钮（敏感工具） -->
	<template id="tmpl-workflow-approval">
		<div class="wf-approval">
			<div class="wf-approval-title">⚠️ 该步骤需要人工确认</div>
			<div class="wf-approval-reason"></div>
			<div class="wf-approval-actions"></div>
		</div>
	</template>
</body>

</html>
