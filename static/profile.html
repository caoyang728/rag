<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>个人中心 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/profile.css">
</head>

<body>
	<div id="topnav-container"></div>

	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header">
				<div class="flex items-baseline gap-10">
					<div class="page-title">个人中心</div>
					<div class="page-subtitle">管理你的资料、AI 记忆、订阅偏好与安全设置</div>
				</div>
			</div>
			<div class="profile-layout">
				<aside class="profile-menu">
					<div class="profile-menu-item active" onclick="setProfileMenu('basic')">👤 基本信息</div>
					<div class="profile-menu-item" onclick="setProfileMenu('memory')">🧠 我的记忆</div>
					<div class="profile-menu-item" onclick="setProfileMenu('permissions')">🔑 我的权限</div>
					<div class="profile-menu-item" onclick="setProfileMenu('email')">📧 邮件订阅</div>
					<div class="profile-menu-item" onclick="setProfileMenu('pwd')">🔐 修改密码</div>
				</aside>
				<div class="profile-content" id="profileContent"></div>
			</div>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/profile.js"></script>

	<!-- ===== 个人中心模板 ===== -->
	<template id="tmpl-profile-basic">
		<div class="card-title">基本信息</div>
		<div class="flex gap-24 items-center mb-24"
			style="padding:16px;background:var(--primary-light);border-radius:var(--radius-lg)">
			<div class="avatar avatar-lg" id="pf-avatar" style="background:linear-gradient(135deg,#2563eb,#1e40af)">
			</div>
			<div class="flex-1">
				<div class="text-xl" id="pf-name"></div>
				<div class="text-sub mt-4" id="pf-role-dept"></div>
				<div class="text-sub text-sm mt-4" id="pf-meta"></div>
			</div>
			<button class="btn" onclick="toast('更换头像功能开发中','')">📷 更换头像</button>
		</div>
		<div class="grid-2" style="gap:16px 24px">
			<div class="form-item">
				<label class="form-label">姓名</label>
				<input class="input" id="profileName">
			</div>
			<div class="form-item">
				<label class="form-label">企业邮箱</label>
				<input class="input" id="pf-email" readonly>
			</div>
			<div class="form-item">
				<label class="form-label">部门</label>
				<input class="input" id="pf-dept" disabled>
			</div>
			<div class="form-item">
				<label class="form-label">团队</label>
				<input class="input" id="pf-team" disabled>
			</div>
			<div class="form-item">
				<label class="form-label">手机号</label>
				<input class="input" id="profilePhone" placeholder="请输入手机号">
			</div>
		</div>
		<div class="mt-16">
			<button class="btn btn-primary" onclick="saveProfile()">保存修改</button>
		</div>
	</template>

	<template id="tmpl-profile-memory">
		<div class="flex justify-between items-center mb-16">
			<div class="card-title" style="margin:0">🧠 我的记忆（用户永久层）</div>
			<button class="btn btn-danger btn-sm" onclick="clearAllMemory()">🗑 清空记忆</button>
		</div>
		<div
			style="padding:12px 14px;background:#fef9c3;border-left:3px solid var(--warning);border-radius:var(--radius);margin-bottom:20px;font-size:13px;line-height:1.6">
			💡 <b>四层记忆机制</b>：短时（Redis）→ 会话（PG）→ <b>用户永久（此处）</b> → 全局系统。个人记忆会影响 AI 对你的回答偏好，仅你本人可见。
		</div>
		<div class="form-item">
			<label class="form-label">职业标签</label>
			<div class="mt-8" id="memoryTagsWrap">
				<button class="btn btn-sm" style="padding:2px 8px" onclick="addMemoryTag()">+ 添加</button>
			</div>
			<div class="form-hint">AI 会结合职业标签给出更专业的回答</div>
		</div>
		<div class="form-item">
			<label class="form-label">常用检索类型</label>
			<div class="mt-8" id="memorySearchTypesWrap">
				<button class="btn btn-sm" style="padding:2px 8px" onclick="addMemorySearchType()">+ 添加</button>
			</div>
		</div>
		<div class="form-item">
			<label class="form-label">输出偏好</label>
			<textarea class="textarea" id="memoryOutputPref" style="min-height:100px"></textarea>
			<div class="form-hint">用自然语言描述你希望 AI 如何回答问题</div>
		</div>
		<div class="form-item">
			<label class="form-label">已提炼的偏好（系统自动生成）</label>
			<div style="background:var(--hover);padding:12px 14px;border-radius:var(--radius);font-size:13px;line-height:1.7;color:var(--text-sub)"
				id="profileTextDisplay"></div>
			<div class="form-hint">系统每 24 小时基于你的行为异步提炼一次</div>
		</div>
		<div class="mt-16">
			<button class="btn btn-primary" onclick="saveMemory()">保存记忆</button>
		</div>
	</template>

	<template id="tmpl-profile-perms">
		<div class="flex justify-between items-center mb-16">
			<div class="card-title" style="margin:0">🔑 我的权限</div>
		</div>
		<div
			style="padding:12px 14px;background:var(--primary-light);border-radius:var(--radius);margin-bottom:16px;font-size:13px;line-height:1.7">
			💡 <b>权限说明</b>:权限由角色 + 数据范围决定。同团队角色升级会覆盖旧角色;全局高权角色(用户管理员/文档管理员/合规管理员/超级管理员)4 选 1 互斥。
		</div>
		<div class="card-title" style="font-size:14px;margin-bottom:8px">已分配角色</div>
		<div id="myRolesList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
			<span class="text-sub text-sm">加载中...</span>
		</div>
		<div class="card-title" style="font-size:14px;margin-bottom:8px">权限明细（按模块分组）</div>
		<div id="myPermissionsList" style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">
			<span class="text-sub text-sm">加载中...</span>
		</div>
	</template>

	<template id="tmpl-profile-subscription">
		<div class="card-title">📧 邮件订阅偏好</div>
		<div style="padding:12px 14px;background:var(--primary-light);border-radius:var(--radius);margin-bottom:20px;font-size:13px;line-height:1.6"
			id="sub-email-hint">
		</div>
		<div style="display:flex;flex-direction:column;gap:14px" id="sub-checkboxes">
		</div>
		<div class="mt-16">
			<button class="btn btn-primary" onclick="saveSubscriptions()">保存偏好</button>
		</div>
	</template>

	<template id="tmpl-profile-password">
		<div class="card-title">🔐 修改密码</div>
		<div style="max-width:480px">
			<div class="form-item">
				<label class="form-label">当前密码</label>
				<input class="input" type="password" id="oldPwd" placeholder="请输入当前密码">
			</div>
			<div class="form-item">
				<label class="form-label">新密码</label>
				<input class="input" type="password" id="newPwd" placeholder="至少 8 位，包含大小写字母和数字"
					oninput="updatePwdStrength(this.value)">
				<div class="password-strength" id="pwdStrength">
					<div class="bar"></div>
					<div class="bar"></div>
					<div class="bar"></div>
				</div>
				<div class="password-hint" id="pwdHint">密码强度：待输入</div>
			</div>
			<div class="form-item">
				<label class="form-label">确认新密码</label>
				<input class="input" type="password" id="confirmPwd" placeholder="再次输入新密码">
			</div>
			<div
				style="padding:12px;background:var(--hover);border-radius:var(--radius);font-size:12px;line-height:1.7;color:var(--text-sub)">
				<b>密码安全要求：</b><br>
				• 至少 8 位，最多 32 位<br>
				• 必须包含大写字母、小写字母和数字<br>
				• 建议包含特殊字符（! @ # $ % ^ &amp; *）<br>
				• 不能与旧密码相同<br>
				• 修改后需重新登录
			</div>
			<div class="mt-16">
				<button class="btn btn-primary" onclick="changePassword()">确认修改</button>
			</div>
		</div>
	</template>

	<template id="tmpl-perm-module">
		<div style="padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white)">
			<div class="perm-mod-title" style="font-weight:600;margin-bottom:8px;font-size:13px"></div>
			<div class="perm-mod-tags" style="display:flex;flex-wrap:wrap;gap:6px"></div>
		</div>
	</template>
</body>

</html>
