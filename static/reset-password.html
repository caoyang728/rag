<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>重置密码 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
	<div class="auth-page">
		<div class="auth-card">
			<div class="auth-logo">
				<div class="auth-logo-icon">知</div>
			</div>
			<h1 class="auth-title">重置密码</h1>

			<!-- 步骤 1：输入邮箱 + 图形验证码 -->
			<form class="auth-form" id="step1Form" onsubmit="event.preventDefault();doSendCode()">
				<p class="auth-desc">请输入注册邮箱，我们将向您发送验证码</p>
				<div class="form-item">
					<label class="form-label">邮箱</label>
					<input class="input input-lg" id="resetEmail" type="email" placeholder="请输入注册邮箱" required>
				</div>
				<div class="form-item">
					<label class="form-label">图形验证码</label>
					<div class="auth-captcha">
						<input class="input input-lg" id="resetCaptcha" type="text" placeholder="请输入 4 位验证码"
							maxlength="4">
						<img class="auth-captcha-img" id="resetCaptchaImg" src="" title="点击刷新" onclick="refreshResetCaptcha()"
							alt="验证码">
					</div>
				</div>
				<button type="submit" class="btn btn-primary btn-lg btn-block" id="sendCodeBtn">发送验证码</button>
				<a href="/login/" class="auth-back">← 返回登录</a>
			</form>

			<!-- 步骤 2：输入验证码 + 新密码 + 确认密码（发送验证码后显示） -->
			<form class="auth-form" id="step2Form" style="display:none" onsubmit="event.preventDefault();doResetConfirm()">
				<p class="auth-desc">验证码已发送至您的邮箱（5 分钟内有效），请输入验证码和新密码</p>
				<div class="form-item">
					<label class="form-label">验证码</label>
					<input class="input input-lg" id="resetCode" type="text" placeholder="请输入 6 位验证码" maxlength="6">
				</div>
				<div class="form-item">
					<label class="form-label">新密码</label>
					<input class="input input-lg" id="newPwd" type="password" placeholder="至少 8 位，含大小写字母和数字">
				</div>
				<div class="form-item">
					<label class="form-label">确认密码</label>
					<input class="input input-lg" id="confirmPwd" type="password" placeholder="请再次输入新密码">
				</div>
				<button type="submit" class="btn btn-primary btn-lg btn-block" id="confirmBtn">重置密码</button>
				<a href="javascript:backToStep1()" class="auth-back" id="resendLink">← 重新发送验证码</a>
			</form>

			<div class="auth-footer">
				<div class="auth-footer-badge">🔒 企业内网私有化部署</div>
			</div>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>

	<script src="/static/js/common.js"></script>
	<script>
		let resetCaptchaId = '';
		let resetEmailValue = '';
		let resendTimer = null;

		/** 启动 60 秒重新发送倒计时 */
		function startResendCountdown() {
			const link = document.getElementById('resendLink');
			let remaining = 60;
			link.style.pointerEvents = 'none';
			link.style.opacity = '0.5';
			link.textContent = `重新发送 (${remaining}s)`;
			clearInterval(resendTimer);
			resendTimer = setInterval(() => {
				remaining--;
				if (remaining <= 0) {
					clearInterval(resendTimer);
					link.style.pointerEvents = '';
					link.style.opacity = '';
					link.textContent = '← 重新发送验证码';
				} else {
					link.textContent = `重新发送 (${remaining}s)`;
				}
			}, 1000);
		}

		/** 刷新图形验证码 */
		async function refreshResetCaptcha() {
			const img = document.getElementById('resetCaptchaImg');
			try {
				const resp = await fetch('/api/v1/security/captcha/');
				const data = await resp.json();
				if (resp.ok && data.image_b64) {
					resetCaptchaId = data.captcha_id;
					img.src = `data:image/png;base64,${data.image_b64}`;
					img.style.display = 'block';
				}
			} catch (e) {
				toast('验证码加载失败', 'error');
			}
		}

		/** 步骤 1：发送验证码到邮箱 */
		async function doSendCode() {
			const email = document.getElementById('resetEmail').value.trim();
			const captcha = document.getElementById('resetCaptcha').value.trim();
			if (!email) { toast('请输入邮箱', 'warning'); return; }
			if (!captcha) { toast('请输入图形验证码', 'warning'); return; }

			const btn = document.getElementById('sendCodeBtn');
			btn.disabled = true;
			btn.textContent = '发送中...';
			try {
				const resp = await fetch('/api/v1/auth/password-reset/request/', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email, captcha_id: resetCaptchaId, captcha_code: captcha })
				});
				const data = await resp.json();
				if (!resp.ok) {
					toast(data.detail || '发送失败', 'error');
					refreshResetCaptcha();  // 验证码错误后刷新图形验证码
					return;
				}
				toast(data.message || '验证码已发送', 'success');
				resetEmailValue = email;
				// 切换到步骤 2 并启动 60 秒重新发送倒计时
				document.getElementById('step1Form').style.display = 'none';
				document.getElementById('step2Form').style.display = 'block';
				document.getElementById('resetCode').focus();
				startResendCountdown();
			} catch (e) {
				toast('网络错误，请稍后重试', 'error');
			} finally {
				btn.disabled = false;
				btn.textContent = '发送验证码';
			}
		}

		/** 返回步骤 1 */
		function backToStep1() {
			clearInterval(resendTimer);
			document.getElementById('step1Form').style.display = 'block';
			document.getElementById('step2Form').style.display = 'none';
			document.getElementById('resetCode').value = '';
			document.getElementById('newPwd').value = '';
			document.getElementById('confirmPwd').value = '';
			refreshResetCaptcha();
		}

		/** 步骤 2：验证码 + 新密码 → 重置密码 */
		async function doResetConfirm() {
			const code = document.getElementById('resetCode').value.trim();
			const newPwd = document.getElementById('newPwd').value;
			const confirmPwd = document.getElementById('confirmPwd').value;
			if (!code) { toast('请输入验证码', 'warning'); return; }
			if (!newPwd || !confirmPwd) { toast('请输入新密码', 'warning'); return; }
			if (newPwd !== confirmPwd) { toast('两次输入的密码不一致', 'error'); return; }

			const btn = document.getElementById('confirmBtn');
			btn.disabled = true;
			btn.textContent = '重置中...';
			try {
				const resp = await fetch('/api/v1/auth/password-reset/confirm/', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email: resetEmailValue, code, new_password: newPwd })
				});
				const data = await resp.json();
				if (!resp.ok) {
					toast(data.detail || '重置失败', 'error');
					return;
				}
				toast(data.message || '密码已重置', 'success');
				setTimeout(() => { window.location.href = '/login/'; }, 2000);
			} catch (e) {
				toast('网络错误，请稍后重试', 'error');
			} finally {
				btn.disabled = false;
				btn.textContent = '重置密码';
			}
		}

		// 页面加载时获取图形验证码
		document.addEventListener('DOMContentLoaded', refreshResetCaptcha);
	</script>
</body>

</html>
