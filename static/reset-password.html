<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 · 知库 Agent</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:480px">
      <div class="auth-logo"><div class="auth-logo-icon">知</div></div>
      <h1 class="auth-title">重置密码</h1>
      <p class="auth-desc">通过企业邮箱找回您的账号</p>
      <div id="resetSteps" class="steps">
        <div class="step active" data-s="1"><div class="step-num">1</div><div class="step-name">输入邮箱</div><div class="step-line"></div></div>
        <div class="step" data-s="2"><div class="step-num">2</div><div class="step-name">验证码</div><div class="step-line"></div></div>
        <div class="step" data-s="3"><div class="step-num">3</div><div class="step-name">设置新密码</div></div>
      </div>
      <div id="resetForm"></div>
      <div style="text-align:center;margin-top:16px">
        <a href="/login/">← 返回登录</a>
      </div>
    </div>
  </div>

  <div id="mask" class="mask"></div>
  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/reset-password.js"></script>
</body>
</html>
