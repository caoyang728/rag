<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>工单中心 · 知库 Agent</title>
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/admin.css">
	<link rel="stylesheet" href="/static/css/ticket.css">
</head>

<body>
	<div id="topnav-container"></div>
	<div class="layout">
		<div id="sidebar-container"></div>
		<div class="main main-flex">
			<div class="page-header">
				<div class="flex items-baseline gap-10">
					<div class="page-title">工单中心</div>
					<div class="page-subtitle">工单统一审批处理</div>
				</div>
			</div>

			<div class="card flex flex-col overflow-hidden flex-1 min-h-0">
				<!-- 视角切换 + 筛选工具栏 -->
				<div class="flex items-center gap-8 mb-8 shrink-0 border-b" style="padding-bottom:12px;flex-wrap:wrap;">
					<button id="tab-pending" class="tab-btn tab-active" onclick="switchView('pending')">
						待我审批
						<span id="badge-pending" class="badge badge-danger hidden">0</span>
					</button>
					<button id="tab-processed" class="tab-btn" onclick="switchView('processed')">
						我已审批
					</button>
					<button id="tab-mine" class="tab-btn" onclick="switchView('mine')">
						我的工单
					</button>
					<button id="tab-all" class="tab-btn" onclick="switchView('all')">
						全部工单
					</button>
					<div class="flex-1"></div>
					<!-- 类型筛选：全部类型工单一页展示 -->
					<select id="typeFilter" class="input" style="width:140px;font-size:13px"
						onchange="refreshCurrent()">
						<option value="">全部类型</option>
						<option value="permission">权限审批</option>
						<option value="config">配置变更</option>
						<option value="schedule">定时任务</option>
						<option value="model">模型变更</option>
					</select>
					<!-- 全部工单视角的状态筛选 -->
					<select id="allStatusFilter" class="input hidden" style="width:130px;font-size:13px"
						onchange="refreshCurrent()">
						<option value="">全部状态</option>
						<option value="PENDING">待审批</option>
						<option value="EXECUTED">已通过</option>
						<option value="REJECTED">已驳回</option>
						<option value="CANCELLED">已撤回</option>
					</select>
					<!-- 搜索：工单号/ID/创建人精确 + 任务名模糊 -->
					<input id="searchInput" class="input" style="width:200px;font-size:13px"
						placeholder="工单号 / ID / 创建人 / 任务名"
						onkeydown="if(event.key==='Enter')refreshCurrent()">
					<button class="btn btn-sm btn-outline" onclick="refreshCurrent()">搜索</button>
					<button class="btn btn-sm btn-outline" onclick="refreshCurrent()">刷新</button>
				</div>

				<!-- 工单列表（四视角共用） -->
				<div class="flex flex-col flex-1 min-h-0">
					<div class="card-scroll">
						<table class="table">
							<thead>
								<tr>
								<th style="width:110px">工单号</th>
								<th style="width:80px">类型</th>
								<th>任务名</th>
								<th style="width:110px" id="th-applicant">申请人</th>
								<th style="width:170px" id="th-target">目标</th>
								<th style="width:80px" id="th-status">状态</th>
								<th style="width:130px" id="th-time">申请时间</th>
								<th style="width:90px">进度</th>
								<th style="width:80px">操作</th>
							</tr>
							</thead>
							<tbody id="ticketTable">
								<tr>
									<td colspan="9" class="text-sub text-sm text-center" style="padding:30px">加载中...</td>
								</tr>
							</tbody>
						</table>
					</div>
					<!-- 分页条：每次返回 20 条，页码/总条数由 _renderPagination 渲染 -->
					<div id="ticketPagination" class="pagination"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- 审批详情弹窗 -->
	<div id="approvalModal" class="modal" style="width:720px;max-width:90vw">
		<div class="modal-header">
			<div class="modal-title" id="approvalModalTitle">工单详情</div>
			<button class="modal-close" onclick="closeModal('approvalModal')">&times;</button>
		</div>
		<div class="modal-body overflow-y-auto" style="max-height:70vh" id="approvalModalBody">
		</div>
		<div class="modal-footer" id="approvalModalFooter">
			<button class="btn-cancel" onclick="closeModal('approvalModal')">关闭</button>
			<button class="btn" id="btnTicketWithdraw" style="background:var(--text-sub)" onclick="onWithdrawClick()">
				撤回
			</button>
			<button class="btn" id="btnApproveReject" style="background:var(--danger)" onclick="onRejectClick()">
				驳回
			</button>
			<button class="btn-save" id="btnApproveOk" onclick="onApproveClick()">
				通过
			</button>
		</div>
	</div>

	<div id="mask" class="mask"></div>
	<div id="toast-wrap" class="toast-wrap"></div>
	<script src="/static/js/common.js"></script>
	<script src="/static/js/api.js"></script>
	<script src="/static/js/layout.js"></script>
	<script src="/static/js/ticket.js"></script>
</body>

</html>
